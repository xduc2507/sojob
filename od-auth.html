<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>OneDrive · Sổ Job</title>
<style>body{font:15px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:32px 20px;color:#1c1c1e;background:#f2f2f7;text-align:center}@media (prefers-color-scheme:dark){body{color:#f2f2f7;background:#1c1c1e}}</style></head>
<body><p>Đang nối OneDrive… cửa sổ này sẽ tự đóng.</p>
<script>/* trả mã đăng nhập Microsoft về cho cửa sổ Sổ Job đã mở trang này (cùng tên miền), rồi đóng */
try{localStorage.setItem("sojob.odcb",JSON.stringify({q:location.search,at:Date.now()}))}catch(e){}
try{history.replaceState(null,"",location.pathname)}catch(e){}
setTimeout(function(){try{window.close()}catch(e){}},1200);</script></body></html>
