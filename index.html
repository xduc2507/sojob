<style>
/* Layout: bàn điều phối 3 cột — nhóm FWD | danh sách / bảng quy trình / kế hoạch | phiếu job */
:root{
  --bg:#E8F2EC; --surface:#FBFDFB; --surface-2:#EEF6F1; --ink:#13261B; --muted:#4D6656; --line:#CBDFD2;
  --accent:#1F7A4D; --accent-ink:#FFFFFF; --accent-soft:#D9EEE1;
  --ok:#2F8A3E; --ok-soft:#DDF1E0; --warn:#9A6A10; --warn-soft:#F8EFD6; --bad:#B42318; --bad-soft:#FBE3E0; --info:#1C5FA8; --info-soft:#DCE8F6;
  --violet:#0E6C76; --violet-soft:#D6EDEF;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1610; --surface:#112019; --surface-2:#162A20; --ink:#E1EFE6; --muted:#8EA999; --line:#234035;
  --accent:#4CC38A; --accent-ink:#05140C; --accent-soft:#163A28;
  --ok:#6BCB77; --ok-soft:#173321; --warn:#E0AE4B; --warn-soft:#352915; --bad:#F2766B; --bad-soft:#3A1C1A; --info:#7FB2F0; --info-soft:#16293F;
  --violet:#5CC6CF; --violet-soft:#12333A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1610; --surface:#112019; --surface-2:#162A20; --ink:#E1EFE6; --muted:#8EA999; --line:#234035;
  --accent:#4CC38A; --accent-ink:#05140C; --accent-soft:#163A28;
  --ok:#6BCB77; --ok-soft:#173321; --warn:#E0AE4B; --warn-soft:#352915; --bad:#F2766B; --bad-soft:#3A1C1A; --info:#7FB2F0; --info-soft:#16293F;
  --violet:#5CC6CF; --violet-soft:#12333A;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
button.sm{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
textarea{resize:vertical}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--accent);
  display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand i{width:18px;height:18px;border-radius:0 70% 0 70%;background:linear-gradient(135deg,var(--accent),var(--info));display:inline-block;transform:rotate(-8deg)}
.top input{max-width:340px;margin-left:auto}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,740px);gap:16px;align-items:start;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#side{display:flex;flex-direction:column;gap:2px;position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}
.side-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.g{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;width:100%}
.g:hover{background:var(--surface)}
.g.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.g span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

#main{min-width:0;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:5px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--surface);font-weight:600}
.bar .sp{flex:1}
.bar select{width:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--accent-soft)}
.row .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:span 2;align-self:start;padding-top:2px}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;grid-column:2/4;align-items:center}
.row .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.fwd{color:var(--ink);font-weight:500}
.st0,.st2{background:var(--info-soft);color:var(--info);border-color:transparent}
.st1{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st3,.st4{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.st5,.st6,.st7{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st8,.st9{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st10{background:var(--ok);color:var(--surface);border-color:transparent}
.st11{text-decoration:line-through}
.pill.svc{font-weight:700;font-size:11px;color:var(--ink)}
.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dl-over{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.dl-today{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.urgent{color:var(--bad);font-weight:700;font-size:12px}
.shr.on{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.shb{font-size:11px;color:var(--info);white-space:nowrap}
.ex{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted);font-size:11px;padding:0 6px;border-radius:4px;letter-spacing:.04em}
.grp-h{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.grp-h:first-child{border-radius:var(--r) var(--r) 0 0}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.plan-task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.plan-task input{margin-top:3px}
.plan-task .sub{grid-column:2;font-size:12.5px;color:var(--muted);cursor:pointer}
.plan-task .sub:hover{color:var(--accent)}
.plan-task .sub2{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.plan-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px) 150px auto;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
@media (max-width:780px){.plan-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.plan-add #pa-text{grid-column:1/-1}}

/* partner profile */
.prof{padding:16px;display:flex;flex-direction:column;gap:12px}
.prof-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prof-h h2{margin:0;font-size:19px}
.prof-h span{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.stat.debt b{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.hwrap{overflow-x:auto;margin-top:8px}
table.h{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
table.h th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table.h td{padding:4px 6px;border-bottom:1px dashed var(--line)}
table.h .num{text-align:right}

/* board */
/* Bảng kiểu Base Workflow: cột cao toàn màn, thẻ trắng, thẻ quá hạn đỏ, cột Đã thu xanh */
body.view-board .app{grid-template-columns:minmax(0,1fr)}
body.view-board #side{display:none}
body.view-board #content{background:transparent;border:0}
body.view-board #detail{display:none}
body.view-board.has-detail #detail{display:block;position:fixed;top:0;right:0;bottom:0;width:min(780px,100vw);max-height:none;z-index:20;border-radius:0;
  box-shadow:-12px 0 32px rgba(10,16,22,.22);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.view-board .back{display:inline-block}
.kb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.kb-bar select{width:auto;max-width:260px}
.kb-bar .sum{font-size:12.5px;color:var(--muted)}
.kb-bar .sum b{color:var(--bad)}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;height:calc(100vh - 190px);min-height:420px;align-items:stretch}
.col{--c:var(--muted);flex:0 0 272px;background:var(--surface-2);border-radius:6px;display:flex;flex-direction:column;min-height:0;border:2px solid transparent;border-top:3px solid var(--c)}
.col.over{border-color:var(--accent);border-top-color:var(--accent)}
.col-h{padding:9px 12px 8px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:4px 4px 0 0}
.col-h .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.col-h .nr{display:flex;gap:6px;align-items:center}
.col-h .add{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;min-height:24px;border-radius:4px}
.col-h .add:hover{background:var(--surface-2);color:var(--ink)}
.col-h .nm .n{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 8px}
.col-h .sub{font-size:11.5px;color:var(--muted)}
.col-h .sub .bad{color:var(--bad);font-weight:600}
.col-b{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.col-b .none{font-size:12px;color:var(--muted);text-align:center;padding:16px 0}
.col.c0,.col.c2{--c:var(--info)}.col.c1{--c:var(--warn)}.col.c3,.col.c4,.col.c5,.col.c6{--c:var(--violet)}.col.c7,.col.c8{--c:var(--accent)}.col.c9,.col.c10{--c:var(--bad)}
.col.c11{--c:#2F8F4E;background:#2F8F4E}.col.c11 .col-h{background:#3FA160;color:#fff;border-bottom-color:transparent}.col.c11 .col-h .sub{color:#E3F5E9}.col.c11 .col-h .nm .n{background:rgba(255,255,255,.2);color:#fff}
.kc{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid transparent;border-radius:5px;padding:7px 9px 6px;display:flex;flex-direction:column;gap:4px;cursor:grab;box-shadow:0 1px 2px rgba(10,16,22,.06)}
.kc:hover{box-shadow:0 3px 10px rgba(10,16,22,.12)}
.kc.on{outline:2px solid var(--accent);outline-offset:-1px}
.kc.dragging{opacity:.4}
.kc.urg{border-left-color:var(--bad)}
.kc .t{font-weight:650;font-size:13px;line-height:1.3;overflow-wrap:anywhere;padding-right:24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .ds{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .tg{display:flex;gap:4px;flex-wrap:wrap}
.kc .tg span{font-size:11px;padding:0 6px;border-radius:3px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.kc .tg .cd{margin-left:auto;background:transparent;border-color:transparent;padding:0;font-variant-numeric:tabular-nums}
.kc.over .tg .cd,.col.c11 .kc .tg .cd{background:transparent;color:inherit;opacity:.85}
.row .cd{font-variant-numeric:tabular-nums}
.kc .tg .w{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.kc .tg .u{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
.kc .ft{display:flex;align-items:center;gap:6px;font-size:12px}
.kc .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.kc .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.kc .tm{flex:none;font-size:11.5px;color:var(--muted)}
.kc .who .co{font-style:normal;font-weight:400;color:var(--muted)}
.kc.over .who .co,.col.c11 .kc .who .co{color:inherit;opacity:.85}
.kc .tm.ok{color:var(--ok);font-weight:600}.kc .tm.td{color:var(--warn);font-weight:700}
.kc .pg{height:3px;border-radius:2px;background:var(--line);overflow:hidden}.kc .pg i{display:block;height:100%;background:var(--ok)}
.kc .mn{position:absolute;top:5px;right:4px;border:0;background:transparent;color:var(--muted);padding:2px 6px;font-size:16px;line-height:1;border-radius:4px;min-height:26px}
.kc .mn:hover{background:var(--surface-2);color:var(--ink)}
/* thẻ quá hạn: nền đỏ, chữ trắng */
.kc.over{background:#C8402F;border-color:#B3382A;color:#fff}
.kc.over .ds,.kc.over .tm,.kc.over .mn{color:#FBE3E0}
.kc.over .tg span{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.kc.over .tm{font-weight:700}
.kc.over .pg{background:rgba(255,255,255,.3)}.kc.over .pg i{background:#fff}
/* thẻ đã thu: nền xanh */
.col.c11 .kc{background:#3FA160;border-color:#358A52;color:#fff}
.col.c11 .kc .ds,.col.c11 .kc .tm,.col.c11 .kc .mn{color:#E3F5E9}
.col.c11 .kc .tg span{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.col.c11 .kc .pg{display:none}
.kc .tg .sv{font-weight:700;color:#fff;border-color:transparent}.kc .tg .sv-hq{background:#2558A6}.kc .tg .sv-vc{background:#A86A12}.kc .tg .sv-both{background:#6B46C1}
.kc .tg .ln-g{background:var(--ok-soft);color:var(--ok);border-color:transparent}.kc .tg .ln-y{background:var(--warn-soft);color:var(--warn);border-color:transparent}.kc .tg .ln-r{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
.kc .note-b,.kc .note-r{font-size:12px;border-radius:4px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .note-b{background:var(--warn-soft);color:var(--warn)}.kc .note-r{background:var(--bad-soft);color:var(--bad)}
.kc.over .note-b,.kc.over .note-r{background:rgba(255,255,255,.18);color:#fff}
.kc.over .tg .sv{background:rgba(0,0,0,.25)}
.row.late{background:var(--bad-soft);box-shadow:inset 4px 0 0 var(--bad)}
.row.late:hover{background:var(--bad-soft)}
.row .lr{grid-column:2/4;font-size:12.5px;color:var(--bad);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lr.pend{color:var(--warn)}.row .lr.ok{color:var(--muted)}
.kc .note-l{font-size:12px;border-radius:4px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bad-soft);color:var(--bad);font-weight:600}
.kc.over .note-l{background:#fff;color:#B3382A}
.kc .note-l.ok{background:var(--surface-2);color:var(--muted);font-weight:400}
.latebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad);color:#fff;border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:13.5px}
.latebar b{font-weight:700}.latebar button{background:#fff;color:var(--bad);border-color:#fff;min-height:0;padding:4px 10px}
.latebar.f{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}.latebar.f button{color:var(--ink);border-color:var(--line)}
.lbox{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;display:flex;flex-direction:column;gap:8px}
.lbox.pend{border-color:var(--warn);background:var(--warn-soft)}.lbox.ok{border-color:var(--line);background:var(--surface-2)}

/* ===== Lớp giao diện thống nhất (tham khảo design-taste-frontend: hover layer, system) =====
   Một thang bo góc, một kiểu nút chính / phụ, một kiểu thẻ; phản hồi rê chuột / bấm nhẹ; focus rõ; điện thoại nút ≥ 44px. */
:root{--r-sm:6px;--r-md:10px;--r-lg:12px;--m-in:150ms;--m-out:120ms;--m-press:90ms;--ease:cubic-bezier(.2,.8,.2,1)}
/* thẻ và khung: cùng một bo góc */
.card,.col,.sec.lot,.teamchat,.review,.dbbox .sheet,.modal .sheet{border-radius:var(--r-lg)}
.kc{border-radius:var(--r-md)}
.pill,.chip{border-radius:999px}
input,select,textarea{border-radius:var(--r-sm)}
/* nút: chính = nền xanh, phụ = viền; cùng bo góc, cùng chuyển động */
button{border-radius:var(--r-sm);transition:background-color var(--m-out) var(--ease),border-color var(--m-out) var(--ease),color var(--m-out) var(--ease),box-shadow var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
button.primary:hover:not(:disabled){background:color-mix(in oklab,var(--accent) 86%,var(--ink));border-color:color-mix(in oklab,var(--accent) 86%,var(--ink))}

@media (hover:hover) and (pointer:fine){
  button:is(.primary,.debitbtn,.tkbtn,.back,#tmSend):hover:not(:disabled),
  .chips2 button:hover:not(:disabled),.svcpick button:hover{transform:translateY(-1px);transition-duration:var(--m-in)}
  /* thẻ job (bảng Quy trình) và dòng job (Danh sách) nhích 2px khi rê chuột */
  .kc{transition:transform 180ms var(--ease),box-shadow 180ms var(--ease),border-color 180ms var(--ease)}
  .kc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,16,22,.10)}
  .row{transition:background-color var(--m-out) var(--ease),transform 180ms var(--ease),box-shadow 180ms var(--ease)}
  .row:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(10,16,22,.08);position:relative;z-index:1}
  .rv{transition:background-color var(--m-out) var(--ease)}
}
/* bấm: lún xuống 1px và nhỏ lại một chút */
button:active:not(:disabled){transform:translateY(1px) scale(.985);transition-duration:var(--m-press)}
.stages button:active,.tabs button:active,.space button:active{transform:scale(.985)}

.sec a:not([class]),.chat a:not([class]),.src a:not([class]),a.link{color:var(--accent);text-decoration:none;
  background:linear-gradient(currentColor,currentColor) left 100%/0% 1px no-repeat,linear-gradient(color-mix(in oklab,currentColor 30%,transparent),color-mix(in oklab,currentColor 30%,transparent)) left 100%/100% 1px no-repeat;
  transition:background-size var(--m-out) var(--ease)}
.sec a:not([class]):is(:hover,:focus-visible),.chat a:not([class]):is(:hover,:focus-visible),.src a:not([class]):is(:hover,:focus-visible),a.link:is(:hover,:focus-visible){background-size:100% 1px,100% 1px;transition-duration:var(--m-in)}
/* focus: vòng 2px màu chính, cách 2px, hiện ngay; ô nhập: viền màu chính + quầng 3px */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;transition:none}

/* nhãn ô nhập luôn hiện, chữ rõ hơn */

/* ===== Phong cách kiểu ePort (chỉ đổi màu, chữ, nút, icon; giữ nguyên cấu trúc) =====
   Open Sans 13px, nền #f3f7fa, menu trên #015198, header mục #1c84c6, nút 2px, ô nhập 5px viền #cfdadd, icon Font Awesome 4.7 */

  --ok:#1ab394;--ok-soft:#e1f5f1;--warn:#b9741c;--warn-soft:#fdf2e3;--bad:#ed5565;--bad-soft:#fde8ea;--info:#1c84c6;--info-soft:#e3f0fa;
  --violet:#059494;--violet-soft:#dff2f2;

  --bg:#0f1720;--surface:#16202b;--surface-2:#1c2833;--ink:#e3e8ee;--muted:#9aa7b4;--line:#2a3846;
  --accent:#3a9be0;--accent-ink:#ffffff;--accent-soft:#16324a;--primary:#3a9be0;--nav:#0b3d73;
  --ok:#2cc9a5;--ok-soft:#13332c;--bad:#f07a87;--bad-soft:#3a1d22;--info:#5fb0ea;--info-soft:#16324a;--violet:#2ab7b7;--violet-soft:#123536}}
:root[data-theme="dark"]{--bg:#0f1720;--surface:#16202b;--surface-2:#1c2833;--ink:#e3e8ee;--muted:#9aa7b4;--line:#2a3846;
  --accent:#3a9be0;--accent-soft:#16324a;--primary:#3a9be0;--nav:#0b3d73;--ok:#2cc9a5;--ok-soft:#13332c;--bad:#f07a87;--bad-soft:#3a1d22}
body{font-family:var(--f-body);font-size:13px;background:var(--bg);color:var(--ink)}
/* icon Font Awesome: 12–13px, trước nhãn, cách 5px */
.fa.ic-fa{font-size:13px;margin-right:5px;width:auto}.fa.ic-after{margin:0 0 0 6px}
.ic-add{color:#1ab394}.ic-edit{color:#f8ac59}.ic-del{color:#ed5565}.ic-blue{color:#1c84c6}
button.primary .fa,button.debitbtn .fa,button.tkbtn .fa,button.go .fa,#btnManual .fa{color:#fff}
/* thanh menu trên: xanh đậm, chữ trắng */
.top{background:var(--nav)!important;border-bottom:0!important;box-shadow:none!important;color:#fff}
.top .brand,.top .brand b,.top a{color:#fff}
.top .brand svg,.top .brand img{filter:brightness(0) invert(1)}
.top button:not(.primary){background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.top button:not(.primary):hover{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.6)!important}
.top #btnManual{background:var(--teal);border-color:var(--teal)}
.top input{background:#fff;color:#333;border-color:#fff}
.top .space{border-color:rgba(255,255,255,.45);background:transparent}
.top .space{background:rgba(255,255,255,.08)!important}.top .space button{background:transparent!important;color:#fff!important;border:0!important}.top .space button.on{background:#fff!important;color:var(--nav)!important;font-weight:600}.top .space button .fa{color:inherit}
.nbell{background:transparent!important;border-color:rgba(255,255,255,.35)!important;color:#fff!important}
.nbell .nb{box-shadow:0 0 0 2px var(--nav)}
/* nút: cao ~26px, bo 2px, chữ 12px; phụ nền #f4f4f4 viền #ddd */
button{border-radius:2px;font-size:12px;padding:4px 10px;min-height:26px}
button:not(.primary):not(.ghost):not(.x):not(.cpop-x):not(.kb-fab):not(.side-btn):not(.np-i):not(.g){background:#f4f4f4;border-color:#dddddd;color:#333}
button.back{background:var(--nav)!important;border-color:var(--nav)!important;color:#fff!important;font-weight:700;border-radius:2px!important}
.kb-fab{background:var(--teal)!important;border-color:var(--teal)!important;color:#fff!important;border-radius:50%!important}
button:not(.primary):not(.ghost):not(.x):not(.cpop-x):hover:not(:disabled){background:#e9e9e9!important;border-color:#cfcfcf!important}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#1a76b1!important;border-color:#1a76b1!important}
button.debitbtn,button.go{background:var(--teal)!important;border-color:var(--teal)!important;color:#fff!important}
button.tkbtn{background:var(--primary)!important;border-color:var(--primary)!important}
button.primary.bad,button.danger:not(.ghost){background:#ef6776!important;border-color:#ef6776!important;color:#fff!important}
button.ghost.danger{color:#ed5565}
button.sm{font-size:11.5px;padding:3px 8px;min-height:22px}
/* ô nhập: cao 28px, bo 5px, viền #cfdadd */
input,select,textarea{border:1px solid #cfdadd;border-radius:5px;font-size:12.5px;background:var(--surface)}
input:not([type=checkbox]):not([type=radio]),select{min-height:28px;padding:3px 8px}
input::placeholder,textarea::placeholder{color:#aaa}
.lot .fld input,.lot .fld select,.lot .fld textarea{font-size:13.5px;min-height:32px}
.fld>span{font-size:12px;font-weight:600;color:#676a6c;opacity:1}
/* header mục: dải xanh #1c84c6, chữ trắng đậm 12px, cao 32px */
.sec h3{background:var(--primary);color:#fff;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;margin:-14px -16px 4px;padding:0 12px;min-height:32px}
.sec h3 .mono{color:#fff;opacity:.85}
.sec h3 button{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.4)!important;color:#fff!important;min-height:22px;font-size:11.5px}
.sec h3 button .fa{color:#fff}
.review summary{background:var(--primary);color:#fff}.review summary .mono{color:#fff}
/* thẻ, khung: góc vuông vức, viền nhạt */
.card,.col,.sec.lot,.teamchat,.review,.kc,.stat,.odbox,.cpop{border-radius:3px}
.list,.card{border-color:var(--line)}
/* dòng đang chọn: nền xanh nhạt, vạch trái #00a8ff */
.row.on{background:#e6f6ff!important;box-shadow:inset 3px 0 0 var(--row-sel)}
.kc.on{outline-color:var(--row-sel)}
/* tab */
.tabs{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.tabs button{border-radius:2px;font-size:12.5px;min-height:28px;background:transparent!important;border:0!important;color:var(--muted)!important}
.tabs button.on{background:var(--primary)!important;color:#fff!important}
/* tiến trình: mũi tên chevron, bước hiện tại #059494, chưa tới #c0c0c0, chữ trắng 11px */
.stages{gap:2px}
.stages button{border-radius:0!important;font-size:11px;color:#fff!important;background:var(--step-off)!important;padding:4px 8px 4px 13px;min-height:24px;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}
.stages button:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-left:10px}
.stages button.past{background:#5cb8b8!important}
.stages button.now{background:var(--step-on)!important;font-weight:700}
/* bảng quy trình */
.col{background:#eef2f5;border-top-width:3px}
.kc{border-color:var(--line)}
/* menu thả xuống: nền trắng, bóng mảnh, không bo góc */
.kmenu,.npanel,.tm-sug,#chatPops .cpop,.dbbox .sheet,.modal .sheet{border-radius:0!important;box-shadow:0 0 3px rgba(86,96,117,.3)!important}

/* nhãn nhỏ */
.pill{border-radius:3px}
.cbadge,.nbell .nb{background:#ed5565}
/* trạng thái đạt: xanh #1ab394 */
.dltag.late,.st8,.st9{color:#ed5565}
@media (max-width:780px){
  button{font-size:13px}

}
/* Quy trình gọn: cột hẹp hơn, thẻ dày hơn để thấy nhiều cột / nhiều job cùng lúc */
.kb{gap:6px}
.col{flex:0 0 196px;border-width:1px;border-top-width:3px}
.col-h{padding:5px 8px 5px;gap:0}

.col-h .nm .n{font-size:11px;padding:0 6px}

@media (max-width:780px){.col{flex-basis:72vw}}
.dmbox{display:flex;gap:4px;position:relative}.dmbox input[name]{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.dmbox .dmcal{flex:0 0 40px;padding:0;display:inline-flex;align-items:center;justify-content:center}.dmbox .dmcal .fa{font-size:15px;color:var(--primary)}

/* tag @ */
.chatin{position:relative}
.mn-sug{position:absolute;left:0;right:0;bottom:calc(100% + 4px);z-index:60;background:var(--surface);border:1px solid var(--line);box-shadow:0 0 3px rgba(86,96,117,.3);max-height:300px;overflow:auto;padding:4px}
.mn-sug button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0!important;background:none!important;padding:7px 10px;min-height:44px;border-radius:2px;gap:1px}

.mn-note{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
.mtag{color:var(--primary);font-weight:700}

.tagme-l{color:#b07a00}

/* báo giá: chọn phí có sẵn + chi hộ */
.qpre{background:var(--accent-soft);border:1px solid #c9dff0;padding:8px 10px;margin:0 0 8px;display:flex;flex-direction:column;gap:6px}
.qpre.ch{background:#fff6e5;border-color:#f0d9a8}
.qpre>b{font-size:12px}.qpre-l{display:flex;flex-wrap:wrap;gap:6px}

.qpre-l button.on{opacity:.55}.qpre-l button.blank{border-style:dashed!important;color:var(--muted)}
.sec h3 button.on{background:rgba(255,255,255,.32)!important}
table.q tr.chhead td{background:#fff6e5;font-weight:700;font-size:12px;color:#8a5a00;padding:5px 6px;border-bottom:1px solid #f0d9a8}

table.q tr.chrow td:first-child{box-shadow:inset 3px 0 0 #f0b400}.chtag{display:none!important}
.chtag{flex:0 0 auto;font-size:10px;font-weight:700;color:#8a5a00;background:#fff0cc;border-radius:3px;padding:1px 5px}
.tot .chsum{color:#8a5a00}

/* nút chọn (dịch vụ, hàng, tuỳ chọn, luồng…): chọn rồi thì tô nền xanh, chữ trắng */
.chips2 button.on,.chips2 button.on:hover{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff!important;font-weight:700}

/* menu xổ xuống chọn phí / chi hộ */

/* nút + menu chọn giao diện */
/* Thanh tiến trình: ô bằng nhau, chữ đủ và căn giữa.
   Rộng thì 1 hàng; vừa thì 2 hàng đều nhau; hẹp (điện thoại) thì 4 ô mỗi hàng. */

  table.q tr.chrow{border-left:4px solid #f0b400}

  table.q tr.chhead td{display:block;border:0!important;padding:0!important}
  table.q td{display:flex;flex-direction:column;gap:2px;border:0!important;padding:0!important;min-width:0}
  table.q td::before{font-size:11.5px;color:var(--muted);font-weight:600}

  table.q tr:not(.chhead) td:nth-child(2)::before{content:"SL"}
  table.q tr:not(.chhead) td:nth-child(3)::before{content:"ĐVT"}
  table.q tr:not(.chhead) td:nth-child(4)::before{content:"Đơn giá"}
  table.q tr:not(.chhead) td:nth-child(5){grid-column:1/3;align-items:flex-start}
  table.q tr:not(.chhead) td:nth-child(5)::before{content:"Thành tiền"}
  table.q tr:not(.chhead) td:nth-child(6)::before{content:"Giá NET"}
  table.q tr:not(.chhead) td:nth-child(7){grid-column:1/3;align-items:flex-start}
  table.q tr:not(.chhead) td:nth-child(7)::before{content:"Thành tiền NET"}
  table.q tr:not(.chhead) td:nth-child(8){grid-column:3/5;align-items:flex-start}
  table.q tr:not(.chhead) td:nth-child(8)::before{content:"Giá lần trước"}
  table.q tr:not(.chhead) td:nth-child(8):empty{display:none}
  table.q tr:not(.chhead) td:nth-child(9){grid-column:4;grid-row:1;align-self:start}
  table.q tr:not(.chhead) td:nth-child(9)::before{content:none}
  table.q tr:not(.chhead) td:nth-child(5),table.q tr:not(.chhead) td:nth-child(7){font-size:16px;font-weight:700}
  table.q td input{width:100%;min-height:44px!important;font-size:16px!important}
  table.q td .x{width:40px;height:40px}
  .qwrap{overflow:visible}
}

/* ===== Giao diện kiểu app máy tính (2026-11-26c): giữ bố cục 3 cột, mỗi khung tự cuộn, thanh tiêu đề + thanh trạng thái,
   chữ Segoe UI, góc vuông 4px, viền rõ, nút/ô nhập cao đều 28px. Chỉ áp cho bản cài trên máy tính (cửa sổ riêng) hoặc thêm ?desk=1; màn rộng ≥1181px. Trình duyệt thường và điện thoại giữ nguyên. ===== */
:root{--dk-side:#f5f6f7;--dk-pane:#ffffff;--dk-bg:#eceef0;--dk-line:#d9dde1;--dk-line2:#c6ccd2;--dk-hover:#eef1f4;--dk-sel:#e3eefa;--dk-head:#f7f8f9;--dk-top:44px;--dk-sb:24px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dk-side:#131c26;--dk-pane:#16202b;--dk-bg:#0f1720;--dk-line:#2a3846;--dk-line2:#34485a;--dk-hover:#1d2a37;--dk-sel:#16324a;--dk-head:#1a2531}}
:root[data-theme="dark"]{--dk-side:#131c26;--dk-pane:#16202b;--dk-bg:#0f1720;--dk-line:#2a3846;--dk-line2:#34485a;--dk-hover:#1d2a37;--dk-sel:#16324a;--dk-head:#1a2531}
.dk-sb{display:none}
@media (min-width:1181px){
  html.desk,html.desk body{height:100%}
  html.desk body{overflow:hidden;background:var(--dk-bg);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13px}
  /* thanh tiêu đề */
  html.desk .top{height:var(--dk-top);padding-block:0!important;gap:10px}
  html.desk .brand .blogo{padding:2px 5px;border-radius:3px}
  html.desk .brand .blogo img{height:26px}
  html.desk .brand b{font-size:13.5px;font-weight:600;letter-spacing:.03em}
  html.desk .top input{height:30px;min-height:30px!important;max-width:440px;border-radius:4px!important;margin-left:auto;margin-right:auto;background:rgba(255,255,255,.95)}
  html.desk .top button{min-height:30px;border-radius:4px!important}
  /* thân: 3 khung sát nhau, ngăn bằng đường kẻ, mỗi khung tự cuộn */
  html.desk .app{height:calc(100dvh - var(--dk-top) - var(--dk-sb));padding:0!important;gap:0;align-items:stretch;grid-template-columns:220px minmax(0,1fr) minmax(0,600px)}
  html.desk .app>*{min-height:0}
  html.desk #side{position:static;top:auto;max-height:none;height:100%;overflow:auto;background:var(--dk-side);border-right:1px solid var(--dk-line);padding:6px 6px 12px;gap:1px}
  html.desk #main{height:100%;overflow:auto;background:var(--dk-bg);padding:0 12px 12px;gap:10px}
  html.desk #main>*{flex-shrink:0}
  html.desk #detail{position:static;top:auto;max-height:none;height:100%;overflow:auto;border:0!important;border-left:1px solid var(--dk-line)!important;border-radius:0!important;margin:0;box-shadow:none!important;background:var(--dk-pane)}
  html.desk body.view-board .app,html.desk body.view-report .app{grid-template-columns:minmax(0,1fr)}
  html.desk body.view-board.has-detail #detail{position:fixed;top:var(--dk-top);bottom:var(--dk-sb);height:auto;box-shadow:-6px 0 18px rgba(0,0,0,.14)!important}
  /* cột trái kiểu thư mục */
  html.desk .side-h{font-size:11px;font-weight:600;letter-spacing:.04em;padding:10px 10px 4px}
  html.desk .g{border-radius:4px;padding:6px 10px;min-height:30px}
  html.desk .g:hover{background:var(--dk-hover)}
  html.desk .g.on{background:var(--dk-sel);box-shadow:inset 3px 0 0 var(--primary);font-weight:600}
  /* thanh lệnh (tab + lọc): dính trên cùng khung giữa, tab gạch chân như ribbon */
  html.desk .bar{position:sticky;top:0;z-index:4;background:var(--dk-pane);margin:0 -12px;padding:0 12px;border-bottom:1px solid var(--dk-line);min-height:42px;gap:8px}
  html.desk .bar .tabs{background:none!important;border:0!important;padding:0;gap:2px;align-self:stretch;flex-wrap:nowrap}
  html.desk .bar .tabs button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;border-radius:0!important;min-height:42px!important;padding:0 10px!important;font-size:13px!important;color:var(--ink)!important;background:none!important;box-shadow:none}
  html.desk .bar .tabs button:hover{background:var(--dk-hover)!important}
  html.desk .bar .tabs button[hidden],html.desk .bar .tabs button.tmore{display:none!important}
  html.desk .bar .tabs button.on{background:none!important;color:var(--primary)!important;font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
  html.desk .bar .tabs .ic-fa{color:var(--primary)}
  html.desk .bar select{width:auto;min-width:120px}
  html.desk .bar>:not(.tabs):not(.sp){margin:6px 0}
  html.desk #banner:not(:empty),html.desk #latebar:not(:empty){margin-top:10px}
  /* khung, thẻ: góc 4px, viền rõ, không bóng */
  html.desk .card,html.desk .sec,html.desk .teamchat,html.desk .mailbox,html.desk .review,html.desk .stat,html.desk .odbox{border-radius:4px!important;box-shadow:none!important;border-color:var(--dk-line)!important}
  html.desk #content.card,html.desk #prof.card{background:var(--dk-pane)}
  /* đầu mục: dải xám nhạt chữ đậm, như hộp nhóm trên Windows */
  html.desk .sec h3{background:var(--dk-head)!important;color:var(--ink)!important;border-bottom:1px solid var(--dk-line);font-size:12.5px;font-weight:700;min-height:34px;border-radius:4px 4px 0 0}
  html.desk .sec h3 .mono{color:var(--muted)!important;opacity:1}
  html.desk .sec h3 .fa,html.desk .sec h3>.ic-fa{color:var(--primary)}
  html.desk .sec h3 button{background:var(--dk-pane)!important;border:1px solid var(--dk-line2)!important;color:var(--ink)!important;min-height:24px}
  html.desk .sec h3 button:hover{background:var(--dk-hover)!important}
  html.desk .sec h3 button .fa{color:var(--primary)}
  html.desk .sec h3 button.on{background:var(--dk-sel)!important;border-color:var(--primary)!important;color:var(--primary)!important}
  html.desk .review summary{background:var(--dk-head)!important;color:var(--ink)!important;border-bottom:1px solid var(--dk-line)}
  html.desk .review summary .mono{color:var(--muted)!important}
  /* nút: cao 28px, góc 4px, viền xám; nút chính nền đặc */
  html.desk button{border-radius:4px;min-height:28px;font-size:12.5px}
  html.desk button:not(.primary):not(.ghost):not(.x):not(.cpop-x):not(.kb-fab):not(.side-btn):not(.np-i):not(.g){background:var(--dk-pane);border-color:var(--dk-line2);color:var(--ink)}
  html.desk button:not(.primary):not(.ghost):not(.x):not(.cpop-x):hover:not(:disabled){background:var(--dk-hover)!important;border-color:#aab3bc!important}
  html.desk button.sm{min-height:24px;font-size:12px}
  html.desk .top button:not(.primary){background:transparent!important;border-color:rgba(255,255,255,.35)!important;color:#fff!important}
  html.desk .top button:not(.primary):hover{background:rgba(255,255,255,.14)!important}
  /* ô nhập: cao 28px, góc 3px, viền rõ, focus viền màu chính */
  html.desk input,html.desk select,html.desk textarea{border-radius:3px;border-color:var(--dk-line2)}
  html.desk input:not([type=checkbox]):not([type=radio]),html.desk select{min-height:28px}
  html.desk input:hover:not(:focus):not(:disabled),html.desk select:hover:not(:focus),html.desk textarea:hover:not(:focus){border-color:#9aa4ae}
  html.desk input:focus,html.desk select:focus,html.desk textarea:focus{outline:0;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)!important}
  /* danh sách job: dòng gọn, chọn = nền xanh nhạt + vạch trái */
  html.desk .row{border-radius:0}
  html.desk .row:hover{background:var(--dk-hover)}
  /* Quy trình: cột và thẻ góc nhỏ, phẳng */
  html.desk .kb{height:calc(100dvh - var(--dk-top) - var(--dk-sb) - 100px)!important;min-height:360px}
  html.desk .kb .col{border-radius:4px!important;box-shadow:none!important}
  html.desk .kb .kc{border-radius:4px!important;box-shadow:0 1px 0 rgba(16,24,40,.06)}
  html.desk .kb .kc:hover{transform:none;box-shadow:0 2px 6px rgba(16,24,40,.14)}
  html.desk .kb .col-b .none{border-radius:4px}
  html.desk .teamchat{height:calc(100dvh - var(--dk-top) - var(--dk-sb) - 66px)!important}
  html.desk .mailbox{height:calc(100dvh - var(--dk-top) - var(--dk-sb) - 66px)!important}
  /* menu nổi, hộp thoại: góc 4px, bóng mảnh */
  html.desk .kmenu,html.desk .npanel,html.desk .tm-sug,html.desk #chatPops .cpop,html.desk .dbbox .sheet,html.desk .modal .sheet,html.desk .stpop,html.desk .qpre{border-radius:4px!important;box-shadow:0 6px 20px rgba(0,0,0,.16),0 0 0 1px var(--dk-line)!important}
  html.desk .pill{border-radius:3px}
  /* thanh cuộn mảnh kiểu Windows */
  html.desk *{scrollbar-width:thin;scrollbar-color:#b9c0c7 transparent}
  html.desk ::-webkit-scrollbar{width:10px;height:10px}
  html.desk ::-webkit-scrollbar-thumb{background:#c3c9cf;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
  html.desk ::-webkit-scrollbar-thumb:hover{background:#9ea6ae;background-clip:padding-box;border:2px solid transparent}
  html.desk ::-webkit-scrollbar-track{background:transparent}
  /* thanh trạng thái dưới đáy */
  html.desk .dk-sb{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--dk-sb);z-index:6;align-items:center;gap:16px;padding:0 12px;background:var(--dk-side);border-top:1px solid var(--dk-line);font-size:11.5px;color:var(--muted);user-select:none;white-space:nowrap;overflow:hidden}
  html.desk .dk-sb i.dot{width:7px;height:7px;border-radius:50%;background:#13a10e;display:inline-block;margin-right:5px}
  html.desk .dk-sb i.dot.off{background:#c50f1f}
  html.desk .dk-sb .sp{flex:1}
  html.desk .dk-sb b{color:var(--ink);font-weight:600}
  html.desk .dk-sb .bad{color:var(--bad);font-weight:600}
}
</style>

};
const stIdx=s=>Math.max(0,STAGES.indexOf(s));
const isOpen=s=>s!==DONE&&s!==FAIL;
const ymOf=t=>{const d=new Date(t||0);return d.getFullYear()*100+d.getMonth()+1};
const isArch=j=>!isOpen(j.status)&&ymOf(j.stageAt||j.updatedAt||j.createdAt)<ymOf(Date.now());
const svcOf=j=>SERVICES.includes(j.service)?j.service:j.svcPending?"HQ+VC":(j.type==="Vận chuyển"?"VC":"HQ");
const svcTag=j=>j.svcPending?"?":svcOf(j);
const VEHICLES=["Xe cont","Xe tải"];

function nextStage(j){const r=route(j),i=r.indexOf(j.status);if(i>=0)return r[i+1]||null;const si=stIdx(j.status);return r.find(s=>stIdx(s)>si)||null}
function prevStage(j){const r=route(j),i=r.indexOf(j.status);if(i>=0)return i>0?r[i-1]:null;const si=stIdx(j.status);return [...r].reverse().find(s=>stIdx(s)<si)||null}
const depositPending=j=>needDeposit(j)&&isOpen(j.status)&&stIdx(j.status)>=stIdx("Bảng kê / debit")&&!["Đã hoàn","Không có cược"].includes(j.deposit);

const $=s=>document.querySelector(s);

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>ymd(new Date());
const dmy=s=>s?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(2,4):"";
const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;let t=String(v??"").replace(/[^\d.\-]/g,"");if((t.match(/\./g)||[]).length>1||/^\-?\d{1,3}\.\d{3}$/.test(t))t=t.replace(/\./g,"");const n=Number(t);return isFinite(n)?n:0};
/* Tiền: VND làm tròn đồng chẵn, ngoại tệ 2 số lẻ; VAT làm tròn riêng rồi mới cộng (khớp hoá đơn) */
const roundMoney=(v,c)=>(c||"VND")==="VND"?Math.round(Number(v)||0):Math.round((Number(v)||0)*100)/100;
const vatOf=(sub,vat,c)=>roundMoney(roundMoney(sub,c)*(Number(vat)||0)/100,c);
const grandOf=(sub,vat,c)=>roundMoney(roundMoney(sub,c)+vatOf(sub,vat,c),c);
const fmt=(n,c)=>(Number(n)||0).toLocaleString("vi-VN",{maximumFractionDigits:c==="USD"?2:0});
const normName=s=>String(s||"").replace(/[đĐ]/g,"d").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const slug=s=>normName(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"u"+[...String(s)].reduce((h,c)=>(h*31+c.codePointAt(0))>>>0,7).toString(36);
function dayDiff(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function dlPill(s,open=true){const k=dayDiff(s);if(k===null)return"";let cls="",txt;
  if(open&&k<0){cls="dl-over";txt=`Quá hạn ${-k} ngày`}else if(open&&k===0){cls="dl-today";txt="Hạn hôm nay"}else if(open&&k===1){txt="Hạn mai"}else txt="Hạn "+s.slice(8)+"/"+s.slice(5,7);
  return `<span class="pill ${cls}">${txt}</span>`}
const groupKey=j=>(j.fwd||"").trim()||(j.company||"").trim()||NOGROUP;
const stPill=s=>`<span class="pill st${stIdx(s)}">${esc(s)}</span>`;

const S={all:[],pMine:{},jobs:[],sel:null,group:"__all",svc:"",view:"today",q:"",fStatus:"open",loaded:false,tpl:JSON.parse(JSON.stringify(DEFAULT_TPL)),stall:{...DEFAULT_STALL},partners:{},todos:[]};
const stageDays=j=>j.stageAt?Math.floor((Date.now()-j.stageAt)/864e5):null;
const isOverdue=j=>isOpen(j.status)&&(dayDiff(j.deadline)??0)<0;
const isStalled=j=>{if(!isOpen(j.status))return false;if(STRICT.includes(j.status))return isStrictLate(j);const n=num(S.stall[j.status]),d=stageDays(j);return n>0&&d!==null&&d>=n};
/* 3 bước hải quan: tính quá hạn theo giờ, không tính Chủ nhật; phải ghi lý do, chủ sổ duyệt mới hết cảnh báo */
const STRICT=["Nhận & kiểm tra chứng từ","Đang khai báo",...HQWAIT];
const LATE_REASONS={
  "Nhận & kiểm tra chứng từ":["Khách chưa gửi đủ chứng từ","Chứng từ sai / lệch, chờ sửa","Chờ C/O","Chờ khách chốt mã HS / giá"],
  "Đang khai báo":["Chờ khách duyệt tờ khai nháp","Chờ giấy phép / kiểm tra chuyên ngành","Lỗi hệ thống VNACCS / ECUS","Chờ nộp thuế"],
  "Đã truyền tờ khai":["Chờ hệ thống phân luồng","Chờ nộp thuế / bảo lãnh","Hải quan yêu cầu bổ sung","Lỗi hệ thống VNACCS / ECUS"],
  "Trình tờ khai cho Hải quan":["Luồng vàng, chờ duyệt hồ sơ","Hải quan yêu cầu bổ sung","Chờ nộp thuế / bảo lãnh","Chờ kết quả kiểm tra chuyên ngành"],
  "Kiểm hóa":["Luồng đỏ, chờ lịch kiểm hoá","Chờ kết quả kiểm tra chuyên ngành","Hải quan yêu cầu bổ sung","Chờ nộp thuế / bảo lãnh"]};
function workMs(a,b){let t=0,x=a;while(x<b){const d=new Date(x),e=Math.min(b,new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime());if(d.getDay()!==0)t+=e-x;x=e}return t}
/* Cảnh báo bật lúc 00:00: nửa đêm đầu tiên sau khi đủ mốc (không tính Chủ nhật), lặp lại mỗi 00:00 cho tới khi chuyển bước */
const midnight=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()};
const skipSun=t=>new Date(t).getDay()===0?midnight(t):t;
function addWork(t,ms){let x=t;while(ms>0){const e=midnight(x);if(new Date(x).getDay()===0){x=e;continue}const k=Math.min(ms,e-x);x+=k;ms-=k}return x}
function warnStart(j){const n=num(S.stall[j.status]);if(!(n>0&&j.stageAt))return null;const x=addWork(j.stageAt,n*864e5),d=new Date(x);return skipSun(d.getHours()||d.getMinutes()||d.getSeconds()||d.getMilliseconds()?midnight(x):x)}
function lateDays(j){const w=warnStart(j);let c=0;for(let x=w;x<=Date.now();x=midnight(x))if(new Date(x).getDay()!==0)c++;return c}
const nextAsk=t=>skipSun(midnight(t)); // lý do đã duyệt có hiệu lực tới 00:00 hôm sau
const isStrictLate=j=>{if(!isOpen(j.status)||!STRICT.includes(j.status))return false;const w=warnStart(j);return w!==null&&Date.now()>=w};
// "none": chưa có lý do (hoặc lý do đã hết hạn / bị trả về) · "pend": chờ chủ sổ duyệt · "ok": đã duyệt
function lateState(j){
  if(!isStrictLate(j))return null;
  const a=j.lateAck;
  if(!a||a.stage!==j.status||a.stageAt!==j.stageAt||a.rejected)return "none";
  if(!a.approved)return "pend";
  return Date.now()<nextAsk(a.approvedAt||0)?"ok":"none";
}
const hm=t=>{if(!t)return "";const d=new Date(t),p2=n=>String(n).padStart(2,"0");return `${p2(d.getHours())}:${p2(d.getMinutes())} ${p2(d.getDate())}/${p2(d.getMonth()+1)}`};
function lateLine(j){
  const st=lateState(j);if(!st)return null;const a=j.lateAck||{};
  const head=`⚠ Trễ ${lateDays(j)} ngày ở ${j.status}`;
  const stale=a.stage===j.status&&a.stageAt===j.stageAt;
  if(st==="ok")return {cls:"ok",text:`${head} · Đã duyệt: ${a.reason}`};
  if(st==="pend")return {cls:"pend",text:`${head} · Chờ duyệt: ${a.reason} (${a.byName||""} ${hm(a.at)})`};
  return {cls:"",text:`${head} · ${stale&&a.rejected?"Lý do bị trả về: "+(a.rejectNote||a.reason):stale&&a.approved?"Lý do cũ đã hết hạn, ghi lại":"Chưa ghi lý do"}`};
}
const isLate=j=>{const st=lateState(j);if(st)return st!=="ok"||isOverdue(j);return isOverdue(j)||(isStalled(j)&&!STRICT.includes(j.status))};
let db=null,sample=null,assets=null;

/* Chủ sổ có 2 sổ: "Sổ chung" (làm cùng nhân viên) và "Việc riêng" (chỉ mình chủ sổ) */
const SPACE_LS="sojob.space";
/* Việc riêng có khoá: hỏi mật khẩu khi vào, tự khoá sau 10 phút không dùng. Chỉ lưu mã băm, không lưu mật khẩu. */
const LOCK_SALT="sojob-mine-v1",LOCK_HASH="d6c57a2ad5c3b29c4089878e7c8823ecc53cd4cb1dfcb9476d3086d50901c39e",LOCK_TTL=10*60*1000,LOCK_SS="sojob.mineUntil";
let mineUntil=(()=>{try{return +(sessionStorage.getItem(LOCK_SS)||0)}catch(e){return 0}})();
const mineOpen=()=>Date.now()<mineUntil;
function touchMine(){mineUntil=Date.now()+LOCK_TTL;try{sessionStorage.setItem(LOCK_SS,String(mineUntil))}catch(e){}}
function lockMine(){mineUntil=0;try{sessionStorage.removeItem(LOCK_SS)}catch(e){}}
async function pinHash(p){const te=new TextEncoder(),k=await crypto.subtle.importKey("raw",te.encode(p),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:te.encode(LOCK_SALT),iterations:200000,hash:"SHA-256"},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function unlockMine(){
  if(mineOpen()){touchMine();return true}
  for(let tries=0;tries<3;tries++){
    const v=await ask({title:"🔒 Việc riêng",text:tries?"Sai mật khẩu, nhập lại.":"Nhập mật khẩu để mở Việc riêng.",ok:"Mở",fields:[{id:"pw",label:"Mật khẩu",type:"password",required:true}]});
    if(!v)return false;
    if(await pinHash(v.pw)===LOCK_HASH){touchMine();return true}
  }
  toast("Sai mật khẩu 3 lần.");return false;
}

const spaceOn=()=>team()&&boss(),mineOn=()=>spaceOn()&&SPACE==="mine";

/* Ba thao tác kiểu Base: đi tới (kiểm tra trường bắt buộc), trả về (bắt buộc lý do), thất bại (chọn lý do) */
async function moveJob(j,target){
  if(!j||!target||j.status===target)return false;
  const from=j.status,fi=stIdx(from),ti=stIdx(target),r=route(j);
  if(target===FAIL){
    const v=await ask({title:`Đánh dấu thất bại: ${j.code}`,text:"Chọn lý do để sau này thống kê vì sao mất lô.",ok:"Đánh dấu thất bại",danger:true,
      fields:[{id:"r",label:"Lý do",type:"select",options:FAIL_REASONS,required:true},{id:"n",label:"Ghi chú thêm (không bắt buộc)"}]});
    if(!v)return false;j.failReason=v.r;j.failNote=v.n;setStatus(j,FAIL,"fail",[v.r,v.n].filter(Boolean).join(": "));return true}
  if(!isOpen(from)){setStatus(j,target,"reopen");return true}
  if(ti>fi&&odState(j)==="none"){toast("Lô quá hạn: ghi lý do (hoặc gia hạn) ở khung đỏ trong phiếu job trước khi chuyển tiếp.");if(cur()?.id!==j.id)openJob(j.id);setTimeout(()=>$("#odTxt")?.focus(),150);return false}
  if(ti<fi){
    const v=await ask({title:`Trả về “${target}”`,text:`${j.code} đang ở “${from}”. Ghi lý do trả về (thiếu gì, sai gì) để người làm biết cần sửa gì.`,ok:"Trả về",
      fields:[{id:"n",label:"Lý do trả về",required:true}]});
    if(!v)return false;j.returnNote=v.n;setStatus(j,target,"return",v.n);return true}
  const passed=STAGES.slice(fi+1,ti+1).filter(s=>r.includes(s)||s===target),need=[];
  passed.forEach(s=>(REQ[s]||[]).forEach(q=>{if(!(q[0]==="debitAmount"?num(j.debitAmount):String(j[q[0]]||"").trim()))need.push(q)}));
  if(target===DONE&&needDeposit(j)&&!["Đã hoàn","Không có cược"].includes(j.deposit))need.push(["deposit","Hoàn cược cont","select",DEPOSIT.slice(2)]);
  const undone=(j.tasks||[]).filter(t=>!t.done).length,off=!r.includes(target),warnTasks=ti>=7&&undone>0;
  if(need.length||off||warnTasks){
    const msg=[off?`“${target}” không nằm trong quy trình ${svcOf(j)}.`:"",warnTasks?`Còn ${undone} việc chưa đánh dấu xong.`:"",need.length?"Điền các mục dưới đây để chuyển:":"Vẫn chuyển?"].filter(Boolean).join(" ");
    const v=await ask({title:`Chuyển sang “${target}”`,text:msg,ok:"Chuyển",
      fields:need.map(([id,label,type,opts])=>({id,label,type:type||"text",options:opts,required:true,value:id==="paidDate"?TODAY():id==="debitAmount"?"":(j[id]||"")}))});
    if(!v)return false;
    need.forEach(([id])=>{j[id]=id==="debitAmount"?num(v[id]):v[id]});
  }
  setStatus(j,target,"move");return true;
}

function ask({title,text,fields=[],ok,danger}){
  return new Promise(res=>{
    const d=document.createElement("div");d.className="modal ask";
    d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" style="max-width:460px;margin-top:12vh"><h2>${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:""}
      <form style="display:flex;flex-direction:column;gap:10px">${fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span>${f.type==="select"
        ?`<select name="${f.id}"><option value="">— Chọn —</option>${f.options.map(o=>`<option ${o===f.value?"selected":""}>${esc(o)}</option>`).join("")}</select>`
        :`<input name="${f.id}" type="${f.type||"text"}" value="${esc(f.value||"")}" autocomplete="off" ${f.id==="debitAmount"?'inputmode="decimal"':""} ${f.list?`list="ask-${f.id}"`:""}>${f.list?`<datalist id="ask-${f.id}">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`}</label>`).join("")}
      <div class="mrow"><span class="note err" data-e></span><button type="button" data-c>Huỷ bỏ</button><button class="primary${danger?" bad":""}" type="submit">${esc(ok||"OK")}</button></div></form></div>`;
    document.body.appendChild(d);
    const esck=e=>{if(e.key==="Escape"){e.stopPropagation();done(null)}};
    const done=v=>{d.remove();document.removeEventListener("keydown",esck,true);res(v)};
    document.addEventListener("keydown",esck,true);
    d.querySelector("[data-c]").onclick=()=>done(null);
    d.addEventListener("click",e=>{if(e.target===d)done(null)});
    d.querySelector("form").onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>v[f.id]=String(d.querySelector(`[name="${f.id}"]`).value).trim());
      const miss=fields.find(f=>f.required&&!v[f.id]);if(miss){d.querySelector("[data-e]").textContent="Chưa điền: "+miss.label;d.querySelector(`[name="${miss.id}"]`).focus();return}done(v)};
    setTimeout(()=>(d.querySelector("input,select")||d.querySelector("button.primary")).focus(),20);
  });
}

/* ---------- price memory ---------- */
function priceLines(filterKey){
  const out=[];
  S.jobs.forEach(j=>{if(filterKey&&groupKey(j)!==filterKey)return;
    const date=j.quoteSentAt||ymd(new Date(j.createdAt||Date.now()));
    (j.quote||[]).forEach(q=>{if(num(q.price)>0&&q.name)out.push({name:q.name,n:normName(q.name),price:num(q.price),currency:q.currency||"VND",unit:q.unit||"",date,code:j.code,id:j.id,key:groupKey(j),route:[j.pol,j.pod].filter(Boolean).join(" → "),mode:j.mode})})});
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
function lastPrice(name,key,exceptId){
  const n=normName(name);if(!n)return null;
  const all=priceLines().filter(x=>x.id!==exceptId&&x.n===n);
  return all.find(x=>x.key===key)||all[0]||null;
}
function hintHtml(q,j,i){
  const h=lastPrice(q.name,groupKey(j),j.id);
  if(!h)return `<span class="hint none">—</span>`;
  const same=h.key===groupKey(j);
  return `<button class="hint" data-act="useprice" data-i="${i}" title="${esc(h.key)} · ${esc(h.code)} · ${dmy(h.date)}">${fmt(h.price,h.currency)} ${h.currency}${same?"":" *"}</button>`;
}

/* Ô ngày gõ tay dạng dd/mm (2 số), năm tự lấy năm nay; có nút lịch để chọn */
function dmParse(t){t=String(t||"").trim();if(!t)return "";
  const m=t.match(/^(\d{1,2})\D?(\d{1,2})(?:\D?(\d{2}|\d{4}))?$/)||(/^\d{4}$/.test(t)?[t,t.slice(0,2),t.slice(2)]:null);if(!m)return null;
  const dd=+m[1],mm=+m[2],now=new Date();let y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):now.getFullYear();
  if(mm<1||mm>12||dd<1||dd>new Date(y,mm,0).getDate())return null;
  if(!m[3]&&new Date(y,mm-1,dd)<new Date(now.getFullYear(),now.getMonth()-2,now.getDate()))y++; // đã qua lâu thì hiểu là năm sau
  return `${y}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`}
const dmShow=v=>v?v.slice(8,10)+"/"+v.slice(5,7):"";
function dmWire(root){root.querySelectorAll(".dmbox").forEach(b=>{const t=b.querySelector("input:not(.dmpick)"),p=b.querySelector(".dmpick");
  t.addEventListener("input",e=>{if(e.inputType&&e.inputType.startsWith("delete"))return;let v=t.value.replace(/[^\d/]/g,"");if(/^\d{2}$/.test(v))v+="/";if(/^\d{3}$/.test(v))v=v.slice(0,2)+"/"+v[2];t.value=v});
  t.addEventListener("blur",()=>{const r=dmParse(t.value);if(r)t.value=dmShow(r)+(r.slice(0,4)!==String(new Date().getFullYear())?"/"+r.slice(2,4):"")});
  b.querySelector(".dmcal").onclick=()=>{const r=dmParse(t.value);p.value=r||TODAY();try{p.showPicker()}catch(e){p.focus();p.click()}};
  p.onchange=()=>{if(p.value){t.value=dmShow(p.value)+(p.value.slice(0,4)!==String(new Date().getFullYear())?"/"+p.value.slice(2,4):"");t.focus()}}})}

function openLightbox(list,i){
  let k=i;const d=document.createElement("div");d.className="lb";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML=`<div class="lb-bar"><span></span>${list.length>1?'<button data-lb="-1" aria-label="Ảnh trước">‹</button><button data-lb="1" aria-label="Ảnh sau">›</button>':""}<button data-lb="z">Phóng to</button><button data-lb="x" aria-label="Đóng">✕ Đóng</button></div><div class="lb-wrap"><img alt="Ảnh chụp gốc"></div>`;
  const img=d.querySelector("img"),cap=d.querySelector(".lb-bar span"),zb=d.querySelector('[data-lb="z"]');
  const show=()=>{img.src=list[k];cap.textContent=list.length>1?`Ảnh ${k+1}/${list.length}`:"Ảnh chụp gốc";d.classList.remove("zoom");zb.textContent="Phóng to"};
  const zoom=()=>{d.classList.toggle("zoom");zb.textContent=d.classList.contains("zoom")?"Vừa màn hình":"Phóng to"};
  const close=()=>{d.remove();document.removeEventListener("keydown",key,true)};
  const key=e=>{if(e.key==="Escape"){e.stopPropagation();close()}else if(e.key==="ArrowRight"&&list.length>1){k=(k+1)%list.length;show()}else if(e.key==="ArrowLeft"&&list.length>1){k=(k-1+list.length)%list.length;show()}};
  d.addEventListener("click",e=>{const b=e.target.closest("[data-lb]");
    if(b){const v=b.dataset.lb;if(v==="x")close();else if(v==="z")zoom();else{k=(k+Number(v)+list.length)%list.length;show()}return}
    if(e.target===img)zoom();else if(e.target.classList.contains("lb-wrap"))close()});
  document.addEventListener("keydown",key,true);document.body.appendChild(d);show();
}

/* ---------- Lô hàng: dán chữ / ảnh → tự điền các ô ---------- */
const LOTF={mst:"MST khách",bl:"Số B/L / booking",cont:"Số cont / xe",tkNo:"Số tờ khai",hqCode:"Mã Hải quan",lane:"Luồng",vehicle:"Loại xe",truck:"Nhà xe / biển số",yard:"Bãi hạ cont",cbm:"Số khối (m³)",
  pol:"Nơi đi (POL)",pod:"Nơi đến (POD)",incoterm:"Incoterm",refs:"Số booking / invoice",cargo:"Hàng hoá / số lượng"};
function lotRegex(t){
  t=String(t||"").normalize("NFC");
  // bản không dấu, cùng độ dài, để dò nhãn tiếng Việt viết có / không dấu
  const A=t.split("").map(c=>{const d=c.normalize("NFD").replace(/[̀-ͯ]/g,"");return d.length===1?d:c}).join("").replace(/đ/g,"d").replace(/Đ/g,"D");
  const L=t.split("\n"),LA=A.split("\n"),U=A.toUpperCase();
  const m=(re,i=1,src=A)=>{const x=re.exec(src);return x?String(x[i]||"").trim():""};
  // lấy phần chữ sau nhãn trên cùng dòng (giữ dấu tiếng Việt)
  const after=re=>{for(let i=0;i<LA.length;i++){const x=re.exec(LA[i]);if(x){const v=L[i].slice(x.index+x[0].length).replace(/^[\s:.\-–=>]+/,"").split(/\s*[;|]\s*|\s{3,}|\t/)[0].trim();if(v)return v.slice(0,60)}}return ""};
  const hasDigit=v=>/\d/.test(v)?v:"";
  const o={};
  o.mst=m(/(?:\bmst\b|ma\s*so\s*thue|ma\s*so\s*dn|tax\s*(?:code|id|no)|vat\s*(?:code|no))\D{0,6}(\d{10}(?:\s*-?\s*\d{3})?)/i).replace(/\s/g,"");
  o.bl=hasDigit(m(/(?:\bh?b\/?l\b|\bmbl\b|\bhbl\b|bill(?:\s+of\s+lading)?|\bbl\s*no|van\s*don)\s*(?:no\.?|number|so|#)?\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\-\/]{5,24})/i));
  const conts=[...new Set([...U.matchAll(/\b([A-Z]{3}[UJZ])\s?-?(\d{6})\s?-?(\d)\b/g)].map(x=>x[1]+x[2]+x[3]))];
  let size="";const r1=/\b(\d{1,2})\s*(?:x|×|\*|cont(?:ainer)?s?|cnt?r?s?)\s*(20|40|45)\s*('|’|"|ft|feet|dc|gp|hc|hq|rf|ot|rh)?/i.exec(A),r2=/\b(20|40|45)\s*('|’|ft|dc|gp|hc|hq|rf|ot)?\s*(?:x|×|\*)\s*(\d{1,2})\b/i.exec(A);
  const ty=v=>{v=(v||"").toUpperCase();return /^['’"]|FT|FEET/.test(v)?"'":v};
  if(r1)size=`${+r1[1]}x${r1[2]}${ty(r1[3])}`;else if(r2)size=`${+r2[3]}x${r2[1]}${ty(r2[2])}`;
  o.cont=[size,conts.join(", ")].filter(Boolean).join(" · ");
  o.tkNo=m(/(?:to\s*khai|\bso\s*tk\b|\btk\b|declaration|\bcd\s*no)\D{0,8}(\d{12})/i)||m(/\b([13]\d{11})\b/);
  const ln=m(/(?:phan\s*)?luong\s*[:\-]?\s*(xanh|vang|do)\b/i).toLowerCase()||({green:"xanh",yellow:"vang",red:"do"})[m(/\b(green|yellow|red)\s*(?:channel|lane)/i).toLowerCase()]||"";
  o.lane=ln==="xanh"?"Xanh":ln==="vang"?"Vàng":ln==="do"?"Đỏ":"";
  const pl=/\b(\d{2}[A-Z]{1,2}\d?)\s?[-.]?\s?(\d{3})\.?(\d{2})\b/.exec(t.toUpperCase());
  const nhaxe=after(/(?:nha\s*xe|nha\s*van\s*chuyen|trucking|nhà xe)\s*/i);
  o.truck=[nhaxe.split(/\s*[,;]\s*/)[0],pl?`${pl[1]}-${pl[2]}.${pl[3]}`:""].filter(Boolean).join(" · ");
  if(!conts.length&&/\bxe\s*tai\b|\b\d+(?:[.,]\d+)?\s*tan\b|tai\s*trong/i.test(A))o.vehicle="Xe tải";else if(conts.length||size)o.vehicle="Xe cont";
  o.cbm=m(/(\d+(?:[.,]\d+)?)\s*(?:cbm|m3|m³|khoi)\b/i);
  o.hqCode=m(/(?:ma\s*(?:hq|hai\s*quan|chi\s*cuc)|chi\s*cuc(?:\s*hq)?)\s*[:\-]?\s*(\d{2}[A-Z0-9]{2})\b/i).toUpperCase();
  o.pol=after(/(?:\bpol\b|port\s+of\s+loading|loading\s+port|cang\s*(?:di|xep(?:\s*hang)?)|noi\s*di|\bfrom\s*:|ship\s*from)/i);
  o.pod=after(/(?:\bpod\b|port\s+of\s+discharge|discharge\s+port|cang\s*(?:den|do(?:\s*hang)?|dich)|noi\s*den|\bto\s*:|destination)/i);
  o.incoterm=m(/\b(EXW|FCA|FAS|FOB|CFR|CNF|CIF|CPT|CIP|DAP|DPU|DDP)\b/,1,U);if(o.incoterm==="CNF")o.incoterm="CFR";
  o.refs=hasDigit(m(/(?:invoice|\binv\b|booking|\bbkg\b|hoa\s*don)\s*(?:no\.?|number|so|#)?\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\/\-]{3,24})/i));
  o.cargo=after(/(?:hang\s*hoa|ten\s*hang|mat\s*hang|commodity|description(?:\s+of\s+goods)?|\bgoods)\s*(?=[:\-])/i);
  o.yard=after(/(?:ha\s*(?:cont\s*)?rong|tra\s*(?:cont\s*)?rong|bai\s*ha|depot|empty\s*return)\s*(?:tai|o|ve)?/i).replace(/[,.].*$/,"");
  Object.keys(o).forEach(x=>{if(!o[x])delete o[x]});
  return o;
}
async function lotFill(j){
  const useAI=!!sample&&(window.SOJOB_BLOB_BASE!==""||(()=>{try{return !!localStorage.getItem("sojob.anthropicKey")}catch(e){return false}})());
  const m=aiModal("Tự điền Lô hàng – "+j.code);
  const imgs=[];let drop;
  let lastText="";
  const draw=(pre,warn)=>{
    m.body.innerHTML=`${warn?`<div class="alert bad" style="margin-bottom:8px">${esc(warn)}</div>`:""}<p class="note" style="margin-top:0">Dán email, tin nhắn Zalo, arrival notice, D/O… vào ô dưới, hoặc dán / chọn ảnh chụp chứng từ. App tự tách số B/L, cont, tờ khai, MST, luồng, biển số… rồi cho bạn xem trước khi điền.</p>
      <div class="lf-drop" id="lfDrop"><textarea id="lfTxt" rows="6" placeholder="Dán chữ vào đây (Ctrl+V). Dán ảnh cũng được.">${esc(pre||"")}</textarea>
        <div class="lf-th" id="lfTh"></div>
        <div><button class="ghost sm" id="lfPick">+ Chọn ảnh</button> <span class="note">${useAI?"Có Claude: Claude đọc cả ảnh lẫn chữ. Không có key: app tự đọc chữ (ảnh đọc chậm hơn, kém chính xác hơn).":"Đọc bằng máy, không cần Claude."}</span></div></div>
      <label style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px"><input type="checkbox" id="lfKeep" checked> Lưu ảnh vào “Nguồn gốc & tài liệu” của job</label>`;
    drop=m.body.querySelector("#lfDrop");
    const fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.multiple=true;fi.hidden=true;m.body.appendChild(fi);
    m.body.querySelector("#lfPick").onclick=()=>fi.click();
    fi.onchange=()=>{addImgs([...fi.files]);fi.value=""};
    drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("on")});
    drop.addEventListener("dragleave",()=>drop.classList.remove("on"));
    drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("on");addImgs([...e.dataTransfer.files])});
    m.setActs([{label:"Phân tích",primary:true,fn:run}]);
    setTimeout(()=>m.body.querySelector("#lfTxt").focus(),0);
  };
  const addImgs=fs=>{fs.filter(f=>/^image\//.test(f.type)).slice(0,8-imgs.length).forEach(f=>{imgs.push(f);const im=document.createElement("img");im.src=URL.createObjectURL(f);m.body.querySelector("#lfTh").appendChild(im)})};
  // dán ảnh trong khung này: không để lọt ra màn hình chụp ảnh chung
  const box=m.body.closest(".modal");
  box.addEventListener("paste",e=>{e.stopPropagation();const fs=[...(e.clipboardData?.items||[])].filter(i=>i.kind==="file").map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();addImgs(fs)}});

{"fwd":"","company":"","contact":"tên, SĐT/email nếu thấy","service":"HQ|VC|HQ+VC","vehicle":"Xe cont|Xe tải|\"\" (chỉ khi có vận chuyển: xe đầu kéo / cont là Xe cont; xe tải thùng, hàng lẻ, tính theo tấn là Xe tải)","mst":"mã số thuế chủ hàng nếu thấy","bl":"số B/L hoặc booking chính","cont":"số lượng và loại cont, VD 3x40HC, hoặc số cont; với xe tải ghi số xe / tải trọng","yard":"bãi / depot hạ cont nếu có","cbm":"số khối (m³) nếu có, chỉ ghi số","tkNo":"số tờ khai hải quan nếu có","source":"Email|Zalo|Khác","title":"tiêu đề ngắn ≤ 70 ký tự, nêu việc + hàng/tuyến","type":"${TYPES.join("|")}","mode":"${MODES.filter(Boolean).join("|")}| (rỗng nếu không rõ)","pol":"","pod":"","cargo":"mô tả hàng, số kiện, trọng lượng, số cont nếu có","incoterm":"","refs":"số booking, B/L, invoice, tờ khai nếu có","deadline":"YYYY-MM-DD hoặc \\"\\" (quy đổi 'mai', 'thứ 6', 'trước 15h' theo ngày hôm nay)","priority":"Gấp|Thường|Thấp","summary":"1-3 câu tóm tắt khách cần gì","tasks":["CHỈ những việc riêng của lô này mà checklist mẫu của loại việc chưa có, bắt đầu bằng động từ, 0-5 việc"],"quote":[{"name":"hạng mục phí","qty":1,"unit":"lô|cont|tờ khai|kg|cbm|bộ","price":0,"currency":"VND|USD"}],"questions":["thông tin còn thiếu cần hỏi lại khách"]}

Quy tắc: không bịa số liệu; giá nào tin nhắn không ghi thì để price 0. Nếu là yêu cầu báo giá, liệt kê các hạng mục phí thường gặp cho đúng loại dịch vụ đó (VD khai HQ: phí khai báo hải quan, phí nâng hạ, phí vận chuyển nội địa, phí kiểm hoá nếu có…), đặt tên hạng mục ngắn gọn và nhất quán. Viết tiếng Việt có dấu.${text?`\n\nNội dung chữ người dùng dán thêm:\n"""\n${text.slice(0,12000)}\n"""`:""}`;
}
function normalize(r){
  r=(r&&typeof r==="object"&&!Array.isArray(r))?r:{};
  const s=v=>typeof v==="string"?v.trim():(v==null?"":String(v));
  const pick=(v,arr,d)=>arr.includes(s(v))?s(v):d;
  const dl=/^\d{4}-\d{2}-\d{2}$/.test(s(r.deadline))?s(r.deadline):"";
  const list=v=>Array.isArray(v)?v:(v?[v]:[]);
  const type=pick(r.type,TYPES,"Khác");
  const tasks=tplTasks(type),have=new Set(tasks.map(t=>normName(t.text)));
  list(r.tasks).map(t=>s(typeof t==="object"&&t?t.text:t)).filter(t=>t&&!have.has(normName(t))).slice(0,8).forEach(t=>{if(!have.has(normName(t))){have.add(normName(t));tasks.push({text:t,done:false})}});
  const quote=list(r.quote).filter(q=>q&&typeof q==="object").map(q=>({name:s(q.name),qty:num(q.qty)||1,unit:s(q.unit),price:num(q.price),currency:CURS.includes(s(q.currency))?s(q.currency):"VND"})).filter(q=>q.name).slice(0,25);
  const fwd=s(r.fwd),company=s(r.company),key=fwd||company||NOGROUP;
  quote.forEach(q=>{if(!q.price){const h=lastPrice(q.name,key,null);if(h){q.price=h.price;q.currency=h.currency;if(!q.unit)q.unit=h.unit}}});
  return{fwd,company,contact:s(r.contact),source:pick(r.source,SOURCES,"Khác"),title:s(r.title).slice(0,120),
    type,mode:pick(r.mode,MODES,""),pol:s(r.pol),pod:s(r.pod),cargo:s(r.cargo),incoterm:s(r.incoterm),refs:s(r.refs),
    deadline:dl,priority:pick(r.priority,PRIOS,"Thường"),summary:s(r.summary),tasks,quote,
    status:type==="Báo giá"?"Báo giá":STAGES[0],
    service:SERVICES.includes(s(r.service).toUpperCase().replace(/\s/g,""))?s(r.service).toUpperCase().replace(/\s/g,""):(type==="Vận chuyển"?"VC":"HQ"),
    mst:s(r.mst).replace(/[^\d-]/g,"").slice(0,14),vehicle:VEHICLES.includes(s(r.vehicle))?s(r.vehicle):"",yard:s(r.yard),cbm:s(r.cbm).replace(/[^\d.,]/g,""),bl:s(r.bl),cont:s(r.cont),tkNo:s(r.tkNo).replace(/[^\d]/g,"").slice(0,12),
    questions:list(r.questions).map(s).filter(Boolean).join("\n")};
}

/* ---------- Claude trợ lý: đối chiếu chứng từ, soạn báo giá, soạn tin nhắc ---------- */
function aiErr(e){
  if(e?.code==="cancelled")return "Đã dừng.";
  if(e?.code==="sampling_disabled")return e?.message&&!/API key Claude/.test(e.message)?e.message:"Chưa dùng được AI: chủ sổ cần cài key Gemini miễn phí vào máy chủ (hoặc nhập key Claude trong “Cài đặt”).";
  return (window.SOJOB_BLOB_BASE!=null&&e?.message)?e.message:ERR[e?.code]||"Có lỗi khi gọi Claude ("+(e?.code||"không rõ")+"). Thử lại.";
}
function aiModal(title){
  const d=document.createElement("div");d.className="modal ask aibox";
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h2>${svi("spark")}${esc(title)}</h2><div class="ai-body"></div><div class="ai-acts"></div></div>`;
  const ctl=new AbortController(),body=d.querySelector(".ai-body"),acts=d.querySelector(".ai-acts");
  const esck=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  const close=()=>{ctl.abort();d.remove();document.removeEventListener("keydown",esck,true)};
  document.addEventListener("keydown",esck,true);d.addEventListener("click",e=>{if(e.target===d)close()});
  const setActs=list=>{acts.innerHTML="";list.concat([{label:"Đóng",fn:close}]).forEach(a=>{const b=document.createElement("button");b.textContent=a.label;if(a.primary)b.className="primary";b.onclick=()=>a.fn(b);acts.appendChild(b)})};
  const busy=t=>{body.innerHTML=`<p class="note"><span class="spin"></span>${esc(t)}</p>`;setActs([{label:"Dừng",fn:()=>ctl.abort()}])};
  document.body.appendChild(d);
  return {body,busy,setActs,close,signal:ctl.signal,fail:e=>{body.innerHTML=`<p class="note err">${esc(aiErr(e))}</p>`;setActs([])}};
}

/* 1. Đối chiếu bộ chứng từ */
async function aiDocs(j){
  if(!sample){toast("Chế độ xem này không gọi được Claude.");return}
  const imgs=j.images||[],pdfs=(j.files||[]).filter(f=>/\.pdf$/i.test(f.name)||/^data:application\/pdf/.test(f.id));
  if(!imgs.length&&!pdfs.length){toast("Chưa có ảnh / PDF chứng từ. Bấm “+ Ảnh / tệp” để thêm trước.");return}
  const m=aiModal("Claude đối chiếu chứng từ – "+j.code);
  m.busy(`Claude đang đọc ${imgs.length?imgs.length+" ảnh":""}${imgs.length&&pdfs.length?" và ":""}${pdfs.length?pdfs.length+" PDF":""}… (thường 20–60 giây)`);
  try{
    const images=await Promise.all(imgs.slice(0,12).map(toBlobOf)),documents=await Promise.all(pdfs.slice(0,5).map(f=>toBlobOf(f.id)));
    const p=`Bạn là nhân viên chứng từ giao nhận / khai hải quan ở Việt Nam, rất cẩn thận. Kèm theo là bộ chứng từ của một lô hàng (ảnh chụp và/hoặc PDF): có thể gồm Invoice, Packing list, B/L, Arrival notice, C/O, D/O, hợp đồng, tờ khai, ảnh tin nhắn…
Thông tin job đã có trong sổ:
${jobFacts(j)}

Việc cần làm:
1. Nhận diện từng chứng từ (loại, số, ngày).
2. Đối chiếu chéo: shipper / consignee / notify, tên hàng, số lượng và đơn vị, số kiện, trọng lượng (GW/NW), thể tích, đơn giá, trị giá, tiền tệ, incoterm, số B/L, số cont / seal, cảng đi / đến, tàu / chuyến, ngày tháng, số và ngày invoice ghi trên C/O, tiêu chí xuất xứ, mô tả hàng trên C/O so với invoice.
3. Nêu mọi chỗ lệch, kể cả nhỏ (sai chính tả tên công ty, số làm tròn khác nhau). Chỉ dựa vào những gì đọc được; chỗ nào mờ / không đọc được thì nói rõ, không đoán.
4. Liệt kê chứng từ thường cần cho loại job này mà chưa thấy trong bộ.
Viết tiếng Việt, ngắn gọn.
Trả về DUY NHẤT một JSON:
{"verdict":"Khớp|Có chỗ lệch|Chưa đủ để kết luận",
"docs":[{"type":"loại chứng từ","no":"số","date":"ngày"}],
"issues":[{"level":"Lệch|Cần xem lại","field":"trường","detail":"chứng từ A ghi …, chứng từ B ghi …"}],
"missing":["chứng từ còn thiếu"],
"notes":"lưu ý khác (nếu có)",
"fields":{"bl":"","cont":"số lượng và loại cont hoặc số cont","cargo":"tên hàng ngắn gọn","pol":"","pod":"","incoterm":"","mst":"MST người nhập khẩu VN nếu thấy"}}`;
    const own=window.SOJOB_BLOB_BASE==="";// bản github.io: gửi được PDF và tới 12 ảnh; bản khác: 5 ảnh
    const r=await sample.json(p,own?{signal:m.signal,cache:false,images,documents,maxImages:12}:{signal:m.signal,cache:false,images:images.slice(0,5)});
    const res={at:Date.now(),verdict:String(r.verdict||"Chưa đủ để kết luận"),docs:Array.isArray(r.docs)?r.docs.slice(0,20):[],issues:Array.isArray(r.issues)?r.issues.slice(0,40):[],missing:Array.isArray(r.missing)?r.missing.slice(0,20).map(String):[],notes:String(r.notes||""),fields:r.fields&&typeof r.fields==="object"?r.fields:{}};
    j.docCheck=res;logH(j,{kind:"note",note:`Claude đối chiếu chứng từ: ${res.verdict}${res.issues.length?" ("+res.issues.length+" điểm)":""}`});queueSave(j);
    showDocCheck(j,m);renderDetail(true);
  }catch(e){m.fail(e)}
}
function docCheckHtml(c){
  const cls=/^khớp/i.test(c.verdict)?"vd-ok":/lệch/i.test(c.verdict)?"vd-bad":"vd-warn";
  return `<div><span class="vd ${cls}">${esc(c.verdict)}</span> <span class="muted">Claude đối chiếu lúc ${new Date(c.at).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}. Kết quả do máy đọc: kiểm tra lại trước khi khai.</span></div>
  ${c.docs.length?`<div><b>Chứng từ đã đọc</b><ul>${c.docs.map(x=>`<li>${esc(x.type||"?")}${x.no?" – số "+esc(x.no):""}${x.date?" – "+esc(x.date):""}</li>`).join("")}</ul></div>`:""}
  ${c.issues.length?`<div><b>Điểm cần xem</b><table><thead><tr><th>Mức</th><th>Trường</th><th>Chi tiết</th></tr></thead><tbody>${c.issues.map(x=>`<tr><td class="${/lệch/i.test(x.level)?"lv-bad":"lv-warn"}">${esc(x.level||"")}</td><td>${esc(x.field||"")}</td><td>${esc(x.detail||"")}</td></tr>`).join("")}</tbody></table></div>`:`<div>Không thấy chỗ lệch.</div>`}
  ${c.missing.length?`<div><b>Có thể còn thiếu</b><ul>${c.missing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  ${c.notes?`<div><b>Lưu ý</b><br>${esc(c.notes)}</div>`:""}`;
}
const DOCF={bl:"Số B/L",cont:"Cont",cargo:"Tên hàng",pol:"Cảng đi",pod:"Cảng đến",incoterm:"Incoterm",mst:"MST"};
function showDocCheck(j,m){
  m=m||aiModal("Kết quả đối chiếu – "+j.code);const c=j.docCheck;if(!c){m.close();return}
  m.body.innerHTML=docCheckHtml(c);
  const fill=Object.entries(c.fields||{}).filter(([k,v])=>DOCF[k]&&v&&String(v).trim()&&!String(j[k]||"").trim());
  const text=()=>[`Đối chiếu chứng từ ${j.code}: ${c.verdict}`,...c.issues.map((x,i)=>`${i+1}. [${x.level}] ${x.field}: ${x.detail}`),...(c.missing.length?["Còn thiếu: "+c.missing.join(", ")]:[]),...(c.notes?["Lưu ý: "+c.notes]:[])].join("\n");
  m.setActs([...(fill.length?[{label:`Điền ${fill.length} ô còn trống vào job`,primary:true,fn:b=>{fill.forEach(([k,v])=>j[k]=String(v).trim());queueSave(j);renderAll(true);b.disabled=true;b.textContent="Đã điền: "+fill.map(([k])=>DOCF[k]).join(", ")}}]:[]),
    {label:"Copy kết quả",fn:()=>copy(text())},{label:"Đối chiếu lại",fn:()=>{m.close();aiDocs(j)}}]);
}

/* 2. Soạn báo giá */
async function aiQuote(j){
  if(!sample){toast("Chế độ xem này không gọi được Claude.");return}
  const key=groupKey(j),seen=new Set(),hist=[];
  for(const x of [...priceLines(key),...priceLines()]){if(x.id===j.id)continue;const k=x.n+"|"+x.key;if(seen.has(k))continue;seen.add(k);hist.push(x);if(hist.length>=80)break}
  const m=aiModal("Claude soạn báo giá – "+j.code);m.busy("Claude đang lập báo giá từ yêu cầu và giá đã báo trước đây… (thường 15–40 giây)");
  const p=`Bạn giúp một nhân viên giao nhận / khai hải quan ở Việt Nam lập báo giá dịch vụ.
Job cần báo giá:
${jobFacts(j)}

Giá đã báo trước đây (mới nhất trước; "cùng FWD" là giá đã báo cho chính khách này):
${hist.length?hist.map(x=>`- ${x.name} | ${x.unit||"?"} | ${x.price} ${x.currency} | ${x.key===key?"cùng FWD":"FWD khác: "+x.key} | ${x.date} | ${x.code}${x.route?" | "+x.route:""}`).join("\n"):"(chưa có)"}
${(j.quote||[]).length?"\nBáo giá đang có trong job:\n"+j.quote.map(q=>`- ${q.name} | ${q.qty} ${q.unit} | ${q.price} ${q.currency}`).join("\n"):""}

Yêu cầu:
- Lập các hạng mục phù hợp với dịch vụ (HQ = thủ tục hải quan; VC = vận chuyển; HQ+VC = cả hai) và đúng yêu cầu khách. Dùng ĐÚNG tên hạng mục đã dùng trước đây nếu cùng ý nghĩa.
- Đơn giá: ưu tiên giá cũ "cùng FWD"; nếu chỉ có giá FWD khác thì dùng và ghi rõ trong "basis"; nếu không có giá cũ thì để 0 và basis = "cần hỏi giá". KHÔNG tự bịa giá.
- qty theo số cont / số tờ khai / số chuyến nếu biết, không rõ thì 1.
- Soạn "message": lời nhắn gửi khách để dán Zalo / email, ngắn gọn, lịch sự, liệt kê từng khoản và giá; dùng tiếng Anh nếu yêu cầu gốc viết bằng tiếng Anh, còn lại tiếng Việt. Không đưa khoản giá 0 vào message mà ghi "sẽ báo sau".
Trả về DUY NHẤT JSON:
{"items":[{"name":"","qty":1,"unit":"","price":0,"currency":"VND|USD","basis":"giá cũ cùng FWD (mã job) | giá FWD khác | cần hỏi giá"}],"note":"ghi chú báo giá: chưa gồm gì, hiệu lực…","message":"","questions":["thông tin cần hỏi lại khách để báo chính xác"]}`;
  try{
    const r=await sample.json(p,{signal:m.signal,cache:false});
    const items=(Array.isArray(r.items)?r.items:[]).slice(0,30).map(x=>({name:String(x.name||"").trim(),qty:num(x.qty)||1,unit:String(x.unit||"").trim(),price:num(x.price),currency:CURS.includes(String(x.currency).toUpperCase())?String(x.currency).toUpperCase():"VND",basis:String(x.basis||"")})).filter(x=>x.name);
    const qs=(Array.isArray(r.questions)?r.questions:[]).map(String).filter(Boolean);
    m.body.innerHTML=`<table><thead><tr><th>Hạng mục</th><th class="num">SL</th><th>ĐVT</th><th class="num">Đơn giá</th><th>Căn cứ</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${esc(x.qty)}</td><td>${esc(x.unit)}</td><td class="num">${x.price?vnd(x.price,x.currency):"—"}</td><td class="muted">${esc(x.basis)}</td></tr>`).join("")}</tbody></table>
      ${r.note?`<div><b>Ghi chú</b><br>${esc(r.note)}</div>`:""}
      ${qs.length?`<div><b>Nên hỏi lại khách</b><ul>${qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`:""}
      <label class="fld"><span>Lời nhắn gửi khách (sửa được)</span><textarea id="aiMsg">${esc(r.message||"")}</textarea></label>`;
    const apply=(b,mode)=>{const q=items.map(({basis,...x})=>x);j.quote=mode==="add"?(j.quote||[]).concat(q):q;if(r.note&&!j.quoteNote)j.quoteNote=String(r.note);
      logH(j,{kind:"note",note:`Claude soạn báo giá (${q.length} dòng)`});queueSave(j);renderDetail(true);b.disabled=true;b.textContent="Đã đưa vào báo giá"};
    m.setActs([...(items.length?(j.quote||[]).length?[{label:"Thay báo giá hiện tại",primary:true,fn:b=>apply(b,"set")},{label:"Thêm vào cuối",fn:b=>apply(b,"add")}]:[{label:"Đưa vào báo giá",primary:true,fn:b=>apply(b,"set")}]:[]),
      {label:"Copy lời nhắn",fn:()=>copy(m.body.querySelector("#aiMsg").value)}]);
  }catch(e){m.fail(e)}

/* ---------- đọc chữ miễn phí (không cần Claude): chép chữ trong ảnh + đoán vài trường ---------- */
function guessFromText(t){
  const text=String(t||""),up=text.toUpperCase(),low=normName(text);
  const m=(re,i=1)=>{const r=text.match(re);return r?String(r[i]).trim():""};
  const conts=[...new Set((up.match(/\b[A-Z]{3}U\s?\d{7}\b/g)||[]).map(x=>x.replace(/\s/g,"")))];
  const qty=m(/\b(\d{1,2}\s*[xX×]\s*(?:20|40|45)\s*(?:'|DC|GP|HC|HQ|RF|OT|FR)?)/);
  const cont=[qty.replace(/\s/g,"").replace("×","x"),conts.slice(0,6).join(", ")].filter(Boolean).join(" · ");
  const bl=m(/(?:\bM?H?B\/?L\b|\bBILL\b|\bBOOKING\b|\bBKG\b|vận đơn)\s*(?:NO\.?|NUMBER|số)?\s*[:#.]?\s*([A-Z0-9][A-Z0-9-]{5,})/i);
  const mst=m(/(?:\bMST\b|mã số thuế|tax\s*code)[^\d\n]{0,25}(\d{10}(?:-\d{3})?)/i);
  const tkNo=m(/(?:tờ khai|\bTK\b|số TK)[^\d\n]{0,20}(\d{12})/i)||m(/\b((?:10|30)\d{10})\b/);
  const known=[...new Set(S.jobs.flatMap(j=>[j.fwd,j.company]).filter(Boolean))].sort((a,b)=>b.length-a.length);
  const hit=known.find(n=>normName(n).length>=3&&low.includes(normName(n)));
  const isFwd=hit&&S.jobs.some(j=>j.fwd===hit);
  const vc=/van chuyen|trucking|keo cont|xe cont|xe tai|giao hang|dong hang|ha cont|nang ha|\btruck\b/.test(low);
  const hq=/khai|thong quan|hai quan|to khai|\bc\/o\b|kiem hoa|customs/.test(low);
  const service=vc&&hq?"HQ+VC":vc?"VC":"HQ";
  const cbm=m(/(\d+(?:[.,]\d+)?)\s*(?:cbm|m3|m³|khối)(?![a-z0-9])/i).replace(",",".");
  const yard=m(/(?:hạ cont|hạ rỗng|trả rỗng|depot|bãi hạ)\s*(?:tại|ở|về)?\s*[:：]?\s*([^\n,.;]{3,40})/i);
  const vehicle=service==="HQ"?"":(/xe tai|\btan\b|\btruck\b|hang le|\blcl\b/.test(low)&&!/xe cont|keo cont|\b(20|40|45)\s*(dc|gp|hc|hq|'|ft)/.test(low)?"Xe tải":"Xe cont");
  const type=/bao gia|hoi gia|xin gia|quotation|\brate\b/.test(low)?"Báo giá":service==="VC"?"Vận chuyển":/xuat khau|khai xuat|\bexport\b/.test(low)?"Khai HQ xuất":"Khai HQ nhập";
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>=6&&!/^(from|to|cc|sent|date|gửi|đến|ngày|re:|fw:)\b/i.test(s));
  const subj=m(/(?:subject|tiêu đề|chủ đề)\s*[:：]\s*(.+)/i);
  const title=(subj||lines[0]||"Job đọc từ ảnh").replace(/^(re|fw|fwd)\s*:\s*/i,"").slice(0,90);
  return{title,fwd:hit&&isFwd?hit:"",company:hit&&!isFwd?hit:"",service,vehicle,yard,cbm,type,bl,cont,mst,tkNo,
    summary:text.replace(/\s+/g," ").slice(0,400),source:"Khác",tasks:tplTasks(type),status:type==="Báo giá"?"Báo giá":STAGES[0]};
}

function tkCheckRow(j){const c=j.tkCheck,busy=TK_BUSY===j.id;
