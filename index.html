<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="same-origin"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Theo dõi làm hàng · FDI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E6B45">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Job">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
/* Layout: bàn điều phối 3 cột — nhóm FWD | danh sách / bảng quy trình / kế hoạch | phiếu job */
:root{
  --bg:#E8F2EC; --surface:#FBFDFB; --surface-2:#EEF6F1; --ink:#13261B; --muted:#4D6656; --line:#CBDFD2;
  --accent:#1F7A4D; --accent-ink:#FFFFFF; --accent-soft:#D9EEE1;
  --ok:#2F8A3E; --ok-soft:#DDF1E0; --warn:#9A6A10; --warn-soft:#F8EFD6; --bad:#B42318; --bad-soft:#FBE3E0; --info:#1C5FA8; --info-soft:#DCE8F6;
  --violet:#0E6C76; --violet-soft:#D6EDEF;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1610; --surface:#112019; --surface-2:#162A20; --ink:#E1EFE6; --muted:#8EA999; --line:#234035;
  --accent:#4CC38A; --accent-ink:#05140C; --accent-soft:#163A28;
  --ok:#6BCB77; --ok-soft:#173321; --warn:#E0AE4B; --warn-soft:#352915; --bad:#F2766B; --bad-soft:#3A1C1A; --info:#7FB2F0; --info-soft:#16293F;
  --violet:#5CC6CF; --violet-soft:#12333A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1610; --surface:#112019; --surface-2:#162A20; --ink:#E1EFE6; --muted:#8EA999; --line:#234035;
  --accent:#4CC38A; --accent-ink:#05140C; --accent-soft:#163A28;
  --ok:#6BCB77; --ok-soft:#173321; --warn:#E0AE4B; --warn-soft:#352915; --bad:#F2766B; --bad-soft:#3A1C1A; --info:#7FB2F0; --info-soft:#16293F;
  --violet:#5CC6CF; --violet-soft:#12333A;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
button.sm{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
textarea{resize:vertical}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--accent);
  display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand i{width:18px;height:18px;border-radius:0 70% 0 70%;background:linear-gradient(135deg,var(--accent),var(--info));display:inline-block;transform:rotate(-8deg)}
.top input{max-width:340px;margin-left:auto}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,680px);gap:16px;align-items:start;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#side{display:flex;flex-direction:column;gap:2px;position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}
.side-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.g{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;width:100%}
.g:hover{background:var(--surface)}
.g.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.g span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

#main{min-width:0;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:5px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--surface);font-weight:600}
.bar .sp{flex:1}
.bar select{width:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--accent-soft)}
.row .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:span 2;align-self:start;padding-top:2px}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;grid-column:2/4;align-items:center}
.row .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.fwd{color:var(--ink);font-weight:500}
.st0,.st2{background:var(--info-soft);color:var(--info);border-color:transparent}
.st1{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st3,.st4{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.st5,.st6,.st7{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st8,.st9{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st10{background:var(--ok);color:var(--surface);border-color:transparent}
.st11{text-decoration:line-through}
.pill.svc{font-weight:700;font-size:11px;color:var(--ink)}
.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dl-over{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.dl-today{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.urgent{color:var(--bad);font-weight:700;font-size:12px}
.shr.on{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.shb{font-size:11px;color:var(--info);white-space:nowrap}
.ex{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted);font-size:11px;padding:0 6px;border-radius:4px;letter-spacing:.04em}
.grp-h{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.grp-h:first-child{border-radius:var(--r) var(--r) 0 0}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.plan-task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.plan-task input{margin-top:3px}
.plan-task .sub{grid-column:2;font-size:12.5px;color:var(--muted);cursor:pointer}
.plan-task .sub:hover{color:var(--accent)}
.plan-task .sub2{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.plan-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px) 150px auto;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
@media (max-width:780px){.plan-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.plan-add #pa-text{grid-column:1/-1}}

/* partner profile */
.prof{padding:16px;display:flex;flex-direction:column;gap:12px}
.prof-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prof-h h2{margin:0;font-size:19px}
.prof-h span{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.stat.debt b{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.hwrap{overflow-x:auto;margin-top:8px}
table.h{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
table.h th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table.h td{padding:4px 6px;border-bottom:1px dashed var(--line)}
table.h .num{text-align:right}

/* board */
/* Bảng kiểu Base Workflow: cột cao toàn màn, thẻ trắng, thẻ quá hạn đỏ, cột Đã thu xanh */
body.view-board .app{grid-template-columns:minmax(0,1fr)}
body.view-board #side{display:none}
body.view-board #content{background:transparent;border:0}
body.view-board #detail{display:none}
body.view-board.has-detail #detail{display:block;position:fixed;top:0;right:0;bottom:0;width:min(700px,100vw);max-height:none;z-index:20;border-radius:0;
  box-shadow:-12px 0 32px rgba(10,16,22,.22);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.view-board .back{display:inline-block}
.kb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.kb-bar select{width:auto;max-width:260px}
.kb-bar .sum{font-size:12.5px;color:var(--muted)}
.kb-bar .sum b{color:var(--bad)}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;height:calc(100vh - 190px);min-height:420px;align-items:stretch}
.col{--c:var(--muted);flex:0 0 272px;background:var(--surface-2);border-radius:6px;display:flex;flex-direction:column;min-height:0;border:2px solid transparent;border-top:3px solid var(--c)}
.col.over{border-color:var(--accent);border-top-color:var(--accent)}
.col-h{padding:9px 12px 8px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:4px 4px 0 0}
.col-h .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.col-h .nr{display:flex;gap:6px;align-items:center}
.col-h .add{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;min-height:24px;border-radius:4px}
.col-h .add:hover{background:var(--surface-2);color:var(--ink)}
.col-h .nm .n{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 8px}
.col-h .sub{font-size:11.5px;color:var(--muted)}
.col-h .sub .bad{color:var(--bad);font-weight:600}
.col-b{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.col-b .none{font-size:12px;color:var(--muted);text-align:center;padding:16px 0}
.col.c0,.col.c2{--c:var(--info)}.col.c1{--c:var(--warn)}.col.c3,.col.c4{--c:var(--violet)}.col.c5,.col.c6,.col.c7{--c:var(--accent)}.col.c8,.col.c9{--c:var(--bad)}
.col.c10{--c:#2F8F4E;background:#2F8F4E}.col.c10 .col-h{background:#3FA160;color:#fff;border-bottom-color:transparent}.col.c10 .col-h .sub{color:#E3F5E9}.col.c10 .col-h .nm .n{background:rgba(255,255,255,.2);color:#fff}
.col.c11{--c:#C8402F;background:var(--bad-soft)}.col.c11 .col-h{background:var(--bad-soft);color:var(--bad)}
.kc{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid transparent;border-radius:5px;padding:7px 9px 6px;display:flex;flex-direction:column;gap:4px;cursor:grab;box-shadow:0 1px 2px rgba(10,16,22,.06)}
.kc:hover{box-shadow:0 3px 10px rgba(10,16,22,.12)}
.kc.on{outline:2px solid var(--accent);outline-offset:-1px}
.kc.dragging{opacity:.4}
.kc.urg{border-left-color:var(--bad)}
.kc .t{font-weight:650;font-size:13px;line-height:1.3;overflow-wrap:anywhere;padding-right:24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .ds{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .tg{display:flex;gap:4px;flex-wrap:wrap}
.kc .tg span{font-size:11px;padding:0 6px;border-radius:3px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.kc .tg .cd{margin-left:auto;background:transparent;border-color:transparent;padding:0;font-variant-numeric:tabular-nums}
.kc.over .tg .cd,.col.c10 .kc .tg .cd{background:transparent;color:inherit;opacity:.85}
.row .cd{font-variant-numeric:tabular-nums}
.kc .tg .w{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.kc .tg .u{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
.kc .ft{display:flex;align-items:center;gap:6px;font-size:12px}
.kc .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.kc .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.kc .tm{flex:none;font-size:11.5px;color:var(--muted)}
.kc .who .co{font-style:normal;font-weight:400;color:var(--muted)}
.kc.over .who .co,.col.c10 .kc .who .co{color:inherit;opacity:.85}
.kc .tm.ok{color:var(--ok);font-weight:600}.kc .tm.td{color:var(--warn);font-weight:700}
.kc .pg{height:3px;border-radius:2px;background:var(--line);overflow:hidden}.kc .pg i{display:block;height:100%;background:var(--ok)}
.kc .mn{position:absolute;top:5px;right:4px;border:0;background:transparent;color:var(--muted);padding:2px 6px;font-size:16px;line-height:1;border-radius:4px;min-height:26px}
.kc .mn:hover{background:var(--surface-2);color:var(--ink)}
/* thẻ quá hạn: nền đỏ, chữ trắng */
.kc.over{background:#C8402F;border-color:#B3382A;color:#fff}
.kc.over .ds,.kc.over .tm,.kc.over .mn{color:#FBE3E0}
.kc.over .tg span{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.kc.over .tm{font-weight:700}
.kc.over .pg{background:rgba(255,255,255,.3)}.kc.over .pg i{background:#fff}
/* thẻ đã thu: nền xanh */
.col.c10 .kc{background:#3FA160;border-color:#358A52;color:#fff}
.col.c10 .kc .ds,.col.c10 .kc .tm,.col.c10 .kc .mn{color:#E3F5E9}
.col.c10 .kc .tg span{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.col.c10 .kc .pg{display:none}
.col.c11 .kc{opacity:.85}
.kc .tg .sv{font-weight:700;color:#fff;border-color:transparent}.kc .tg .sv-hq{background:#2558A6}.kc .tg .sv-vc{background:#A86A12}.kc .tg .sv-both{background:#6B46C1}
.kc .tg .ln-g{background:var(--ok-soft);color:var(--ok);border-color:transparent}.kc .tg .ln-y{background:var(--warn-soft);color:var(--warn);border-color:transparent}.kc .tg .ln-r{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
.kc .note-b,.kc .note-r{font-size:12px;border-radius:4px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .note-b{background:var(--warn-soft);color:var(--warn)}.kc .note-r{background:var(--bad-soft);color:var(--bad)}
.kc.over .note-b,.kc.over .note-r{background:rgba(255,255,255,.18);color:#fff}
.kc.over .tg .sv{background:rgba(0,0,0,.25)}
.row.late{background:var(--bad-soft);box-shadow:inset 4px 0 0 var(--bad)}
.row.late:hover{background:var(--bad-soft)}
.row .lr{grid-column:2/4;font-size:12.5px;color:var(--bad);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lr.pend{color:var(--warn)}.row .lr.ok{color:var(--muted)}
.kc .note-l{font-size:12px;border-radius:4px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bad-soft);color:var(--bad);font-weight:600}
.kc.over .note-l{background:#fff;color:#B3382A}
.kc .note-l.ok{background:var(--surface-2);color:var(--muted);font-weight:400}
.latebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad);color:#fff;border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:13.5px}
.latebar b{font-weight:700}.latebar button{background:#fff;color:var(--bad);border-color:#fff;min-height:0;padding:4px 10px}
.latebar.f{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}.latebar.f button{color:var(--ink);border-color:var(--line)}
.lbox{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;display:flex;flex-direction:column;gap:8px}
.lbox.pend{border-color:var(--warn);background:var(--warn-soft)}.lbox.ok{border-color:var(--line);background:var(--surface-2)}
.lbox h4{margin:0;font-size:13.5px;color:var(--bad)}.lbox.pend h4{color:var(--warn)}.lbox.ok h4{color:var(--muted);font-weight:500}
.lbox .chips{display:flex;gap:6px;flex-wrap:wrap}.lbox .chips button{min-height:0;padding:4px 9px;font-size:12.5px;border-radius:999px}
.lbox .chips button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.lbox .lrow{display:flex;gap:6px;flex-wrap:wrap}.lbox .lrow input{flex:1;min-width:160px}
.chat{display:flex;flex-direction:column;gap:6px;min-height:220px;max-height:680px;overflow:auto;padding:4px 2px;margin-bottom:8px}
.chat .m{max-width:85%;align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:6px 10px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.chat .m.me{align-self:flex-end;background:var(--info-soft);border-color:transparent;border-radius:10px 10px 2px 10px}
.chat .seen{align-self:flex-end;display:flex;align-items:center;gap:2px;margin:-3px 2px 3px;font-size:11px;color:var(--muted);cursor:pointer;max-width:90%}
.chat .seen .av{width:16px;height:16px;border-radius:50%;background:hsl(var(--h,210) 50% 46%);color:#fff;font-style:normal;font-size:9.5px;font-weight:700;display:inline-grid;place-items:center;box-shadow:0 0 0 1.5px var(--surface)}

/* ===== Lớp giao diện thống nhất (tham khảo design-taste-frontend: hover layer, system) =====
   Một thang bo góc, một kiểu nút chính / phụ, một kiểu thẻ; phản hồi rê chuột / bấm nhẹ; focus rõ; điện thoại nút ≥ 44px. */
:root{--r-sm:6px;--r-md:10px;--r-lg:12px;--m-in:150ms;--m-out:120ms;--m-press:90ms;--ease:cubic-bezier(.2,.8,.2,1)}
/* thẻ và khung: cùng một bo góc */
.card,.col,.sec.lot,.teamchat,.review,.dbbox .sheet,.modal .sheet{border-radius:var(--r-lg)}
.kc{border-radius:var(--r-md)}
.pill,.chip{border-radius:999px}
input,select,textarea{border-radius:var(--r-sm)}
/* nút: chính = nền xanh, phụ = viền; cùng bo góc, cùng chuyển động */
button{border-radius:var(--r-sm);transition:background-color var(--m-out) var(--ease),border-color var(--m-out) var(--ease),color var(--m-out) var(--ease),box-shadow var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
button.primary:hover:not(:disabled){background:color-mix(in oklab,var(--accent) 86%,var(--ink));border-color:color-mix(in oklab,var(--accent) 86%,var(--ink))}
button:not(.primary):not(.ghost):hover:not(:disabled){background:color-mix(in oklab,var(--surface) 92%,var(--ink));border-color:color-mix(in oklab,var(--line) 60%,var(--ink))}
@media (hover:hover) and (pointer:fine){
  button:is(.primary,.debitbtn,.tkbtn,.back,#tmSend):hover:not(:disabled),
  .chips2 button:hover:not(:disabled),.svcpick button:hover{transform:translateY(-1px);transition-duration:var(--m-in)}
  /* thẻ job (bảng Quy trình) và dòng job (Danh sách) nhích 2px khi rê chuột */
  .kc{transition:transform 180ms var(--ease),box-shadow 180ms var(--ease),border-color 180ms var(--ease)}
  .kc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,16,22,.10)}
  .row{transition:background-color var(--m-out) var(--ease),transform 180ms var(--ease),box-shadow 180ms var(--ease)}
  .row:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(10,16,22,.08);position:relative;z-index:1}
  .rv{transition:background-color var(--m-out) var(--ease)}
}
/* bấm: lún xuống 1px và nhỏ lại một chút */
button:active:not(:disabled){transform:translateY(1px) scale(.985);transition-duration:var(--m-press)}
.stages button:active,.tabs button:active,.space button:active{transform:scale(.985)}
.kc:active{transform:translateY(0) scale(.995)}
/* link: gạch chân chạy ra từ trái sang phải */
.sec a:not([class]),.chat a:not([class]),.src a:not([class]),a.link{color:var(--accent);text-decoration:none;
  background:linear-gradient(currentColor,currentColor) left 100%/0% 1px no-repeat,linear-gradient(color-mix(in oklab,currentColor 30%,transparent),color-mix(in oklab,currentColor 30%,transparent)) left 100%/100% 1px no-repeat;
  transition:background-size var(--m-out) var(--ease)}
.sec a:not([class]):is(:hover,:focus-visible),.chat a:not([class]):is(:hover,:focus-visible),.src a:not([class]):is(:hover,:focus-visible),a.link:is(:hover,:focus-visible){background-size:100% 1px,100% 1px;transition-duration:var(--m-in)}
/* focus: vòng 2px màu chính, cách 2px, hiện ngay; ô nhập: viền màu chính + quầng 3px */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;transition:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent);transition:box-shadow 140ms var(--ease),border-color 140ms var(--ease)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
/* nhãn ô nhập luôn hiện, chữ rõ hơn */
.fld>span{color:var(--ink);opacity:.82;font-weight:500}
/* lỗi nằm ngay dưới ô */
.fld .field__error{display:block;margin-top:4px;color:var(--bad);font-size:13px}
.fld input[aria-invalid="true"]{border-color:var(--bad)}
/* điện thoại: nút và link đủ lớn để bấm (≥ 44px); tiêu đề job xuống dòng riêng, không bị cắt cụt */
@media (max-width:780px){
  button:not(.x):not(.cpop-x):not(.sm):not(.mvbtn-sm),.tabs button,.space button,.top a{min-height:44px}
  button.sm{min-height:36px}
  .chips2 button,.svcpick button{min-height:44px}
  .row{padding:12px 14px}
  .row .t{font-size:15px}
}
/* dòng job: tên job một dòng riêng (tối đa 2 dòng), nhãn ở dưới, không bị cắt cụt khi cột hẹp */
.row{grid-template-columns:auto minmax(0,1fr)}
.row .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .right{grid-column:2/3;justify-content:flex-start}
.row .meta{grid-column:2/3}
/* giảm chuyển động: vẫn đổi màu, không nhích / lún */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-property:background-color,border-color,color,opacity!important}
  .kc:hover,.row:hover,button:hover,button:active,.kc:active{transform:none!important}
  button:active:not(:disabled){filter:brightness(.94)}
}
/* ===== Phong cách kiểu ePort (chỉ đổi màu, chữ, nút, icon; giữ nguyên cấu trúc) =====
   Open Sans 13px, nền #f3f7fa, menu trên #015198, header mục #1c84c6, nút 2px, ô nhập 5px viền #cfdadd, icon Font Awesome 4.7 */
:root{--nav:#015198;--primary:#1c84c6;--teal:#1dc5a3;--step-on:#059494;--step-off:#c0c0c0;--row-sel:#00a8ff;
  --bg:#f3f7fa;--surface:#ffffff;--surface-2:#f4f6f8;--ink:#333333;--muted:#676a6c;--line:#e7eaec;
  --accent:#1c84c6;--accent-ink:#ffffff;--accent-soft:#e3f0fa;
  --ok:#1ab394;--ok-soft:#e1f5f1;--warn:#b9741c;--warn-soft:#fdf2e3;--bad:#ed5565;--bad-soft:#fde8ea;--info:#1c84c6;--info-soft:#e3f0fa;
  --violet:#059494;--violet-soft:#dff2f2;
  --f-body:"Open Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--r:3px;--r-sm:2px;--r-md:3px;--r-lg:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1720;--surface:#16202b;--surface-2:#1c2833;--ink:#e3e8ee;--muted:#9aa7b4;--line:#2a3846;
  --accent:#3a9be0;--accent-ink:#ffffff;--accent-soft:#16324a;--primary:#3a9be0;--nav:#0b3d73;
  --ok:#2cc9a5;--ok-soft:#13332c;--bad:#f07a87;--bad-soft:#3a1d22;--info:#5fb0ea;--info-soft:#16324a;--violet:#2ab7b7;--violet-soft:#123536}}
:root[data-theme="dark"]{--bg:#0f1720;--surface:#16202b;--surface-2:#1c2833;--ink:#e3e8ee;--muted:#9aa7b4;--line:#2a3846;
  --accent:#3a9be0;--accent-soft:#16324a;--primary:#3a9be0;--nav:#0b3d73;--ok:#2cc9a5;--ok-soft:#13332c;--bad:#f07a87;--bad-soft:#3a1d22}
body{font-family:var(--f-body);font-size:13px;background:var(--bg);color:var(--ink)}
/* icon Font Awesome: 12–13px, trước nhãn, cách 5px */
.fa.ic-fa{font-size:13px;margin-right:5px;width:auto}.fa.ic-after{margin:0 0 0 6px}

function workMs(a,b){let t=0,x=a;while(x<b){const d=new Date(x),e=Math.min(b,new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime());if(d.getDay()!==0)t+=e-x;x=e}return t}
/* Cảnh báo bật lúc 00:00: nửa đêm đầu tiên sau khi đủ mốc (không tính Chủ nhật), lặp lại mỗi 00:00 cho tới khi chuyển bước */
const midnight=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()};
const skipSun=t=>new Date(t).getDay()===0?midnight(t):t;
function addWork(t,ms){let x=t;while(ms>0){const e=midnight(x);if(new Date(x).getDay()===0){x=e;continue}const k=Math.min(ms,e-x);x+=k;ms-=k}return x}
function warnStart(j){const n=num(S.stall[j.status]);if(!(n>0&&j.stageAt))return null;const x=addWork(j.stageAt,n*864e5),d=new Date(x);return skipSun(d.getHours()||d.getMinutes()||d.getSeconds()||d.getMilliseconds()?midnight(x):x)}
function lateDays(j){const w=warnStart(j);let c=0;for(let x=w;x<=Date.now();x=midnight(x))if(new Date(x).getDay()!==0)c++;return c}
const nextAsk=t=>skipSun(midnight(t)); // lý do đã duyệt có hiệu lực tới 00:00 hôm sau
const isStrictLate=j=>{if(!isOpen(j.status)||!STRICT.includes(j.status))return false;const w=warnStart(j);return w!==null&&Date.now()>=w};
// "none": chưa có lý do (hoặc lý do đã hết hạn / bị trả về) · "pend": chờ chủ sổ duyệt · "ok": đã duyệt
function lateState(j){
  if(!isStrictLate(j))return null;
  const a=j.lateAck;
  if(!a||a.stage!==j.status||a.stageAt!==j.stageAt||a.rejected)return "none";
  if(!a.approved)return "pend";
  return Date.now()<nextAsk(a.approvedAt||0)?"ok":"none";
}
const hm=t=>{if(!t)return "";const d=new Date(t),p2=n=>String(n).padStart(2,"0");return `${p2(d.getHours())}:${p2(d.getMinutes())} ${p2(d.getDate())}/${p2(d.getMonth()+1)}`};
function lateLine(j){
  const st=lateState(j);if(!st)return null;const a=j.lateAck||{};
  const head=`⚠ Trễ ${lateDays(j)} ngày ở ${j.status}`;
  const stale=a.stage===j.status&&a.stageAt===j.stageAt;
  if(st==="ok")return {cls:"ok",text:`${head} · Đã duyệt: ${a.reason}`};
  if(st==="pend")return {cls:"pend",text:`${head} · Chờ duyệt: ${a.reason} (${a.byName||""} ${hm(a.at)})`};
  return {cls:"",text:`${head} · ${stale&&a.rejected?"Lý do bị trả về: "+(a.rejectNote||a.reason):stale&&a.approved?"Lý do cũ đã hết hạn, ghi lại":"Chưa ghi lý do"}`};
}

async function pinHash(p){const te=new TextEncoder(),k=await crypto.subtle.importKey("raw",te.encode(p),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:te.encode(LOCK_SALT),iterations:200000,hash:"SHA-256"},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function unlockMine(){
  if(mineOpen()){touchMine();return true}
  for(let tries=0;tries<3;tries++){
    const v=await ask({title:"🔒 Việc riêng",text:tries?"Sai mật khẩu, nhập lại.":"Nhập mật khẩu để mở Việc riêng.",ok:"Mở",fields:[{id:"pw",label:"Mật khẩu",type:"password",required:true}]});
    if(!v)return false;
    if(await pinHash(v.pw)===LOCK_HASH){touchMine();return true}
  }
  toast("Sai mật khẩu 3 lần.");return false;
}

  if(b.dataset.vat==="open")VAT_OPEN=true;else{VAT_OPEN=false;j.vat=+b.dataset.vat;queueSave(j)}renderDetail(true)},true);
const vatRate=j=>num(j.vat)===10?10:8; // mặc định 8%, chọn được 10%
function totals(j){const t={};(j.quote||[]).filter(q=>!q.ch).forEach(q=>{const c=q.currency||"VND";t[c]=(t[c]||0)+num(q.qty)*num(q.price)});return t}
function chTotals(j){const t={};(j.quote||[]).filter(q=>q.ch).forEach(q=>{const c=q.currency||"VND";t[c]=(t[c]||0)+num(q.qty)*num(q.price)});return t}
function logH(j,o){(j.history=j.history||[]).push(Object.assign({at:Date.now(),by:window.SOJOB_USER||""},o));if(j.history.length>200)j.history=j.history.slice(-200)}
function setStatus(j,st,kind="move",note=""){
  const from=j.status;
  if(from!==st){j.stageAt=Date.now();logH(j,{kind,from,to:st,note});if(j.lateAck){if(j.blocker===j.lateAck.reason)j.blocker="";delete j.lateAck}}
  j.status=st;
  if(kind!=="return")j.returnNote="";
  if(from!==st&&kind!=="return"&&kind!=="create")try{autoRule(j,"st:"+st)}catch(e){}
  if(st==="Báo giá"&&!j.quoteSentAt&&(j.quote||[]).length)j.quoteSentAt=TODAY();
  if(st==="Chờ thu tiền"&&!j.debitDate)j.debitDate=TODAY();
  if(st===DONE&&!j.paidDate)j.paidDate=TODAY();
  if(!isOpen(st))j.blocker="";
  queueSave(j);
}
/* Ba thao tác kiểu Base: đi tới (kiểm tra trường bắt buộc), trả về (bắt buộc lý do), thất bại (chọn lý do) */
async function moveJob(j,target){
  if(!j||!target||j.status===target)return false;
  const from=j.status,fi=stIdx(from),ti=stIdx(target),r=route(j);
  if(target===FAIL){
    const v=await ask({title:`Đánh dấu thất bại: ${j.code}`,text:"Chọn lý do để sau này thống kê vì sao mất lô.",ok:"Đánh dấu thất bại",danger:true,
      fields:[{id:"r",label:"Lý do",type:"select",options:FAIL_REASONS,required:true},{id:"n",label:"Ghi chú thêm (không bắt buộc)"}]});
    if(!v)return false;j.failReason=v.r;j.failNote=v.n;setStatus(j,FAIL,"fail",[v.r,v.n].filter(Boolean).join(": "));return true}
  if(!isOpen(from)){setStatus(j,target,"reopen");return true}
  if(ti>fi&&odState(j)==="none"){toast("Lô quá hạn: ghi lý do (hoặc gia hạn) ở khung đỏ trong phiếu job trước khi chuyển tiếp.");if(cur()?.id!==j.id)openJob(j.id);setTimeout(()=>$("#odTxt")?.focus(),150);return false}
  if(ti<fi){
    const v=await ask({title:`Trả về “${target}”`,text:`${j.code} đang ở “${from}”. Ghi lý do trả về (thiếu gì, sai gì) để người làm biết cần sửa gì.`,ok:"Trả về",
      fields:[{id:"n",label:"Lý do trả về",required:true}]});
    if(!v)return false;j.returnNote=v.n;setStatus(j,target,"return",v.n);return true}
  const passed=STAGES.slice(fi+1,ti+1).filter(s=>r.includes(s)||s===target),need=[];
  passed.forEach(s=>(REQ[s]||[]).forEach(q=>{if(!(q[0]==="debitAmount"?num(j.debitAmount):String(j[q[0]]||"").trim()))need.push(q)}));
  if(target===DONE&&needDeposit(j)&&!["Đã hoàn","Không có cược"].includes(j.deposit))need.push(["deposit","Hoàn cược cont","select",DEPOSIT.slice(2)]);
  const undone=(j.tasks||[]).filter(t=>!t.done).length,off=!r.includes(target),warnTasks=ti>=7&&undone>0;
  if(need.length||off||warnTasks){
    const msg=[off?`“${target}” không nằm trong quy trình ${svcOf(j)}.`:"",warnTasks?`Còn ${undone} việc chưa đánh dấu xong.`:"",need.length?"Điền các mục dưới đây để chuyển:":"Vẫn chuyển?"].filter(Boolean).join(" ");
    const v=await ask({title:`Chuyển sang “${target}”`,text:msg,ok:"Chuyển",
      fields:need.map(([id,label,type,opts])=>({id,label,type:type||"text",options:opts,required:true,value:id==="paidDate"?TODAY():id==="debitAmount"?"":(j[id]||"")}))});
    if(!v)return false;
    need.forEach(([id])=>{j[id]=id==="debitAmount"?num(v[id]):v[id]});
  }
  setStatus(j,target,"move");return true;
}
async function moveAndRender(j,target){const ok=await moveJob(j,target);if(ok)toast(`${j.code} → ${j.status}`);renderAll(S.sel===j.id)}
function ask({title,text,fields=[],ok,danger}){
  return new Promise(res=>{
    const d=document.createElement("div");d.className="modal ask";
    d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" style="max-width:460px;margin-top:12vh"><h2>${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:""}
      <form style="display:flex;flex-direction:column;gap:10px">${fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span>${f.type==="select"
        ?`<select name="${f.id}"><option value="">— Chọn —</option>${f.options.map(o=>`<option ${o===f.value?"selected":""}>${esc(o)}</option>`).join("")}</select>`
        :`<input name="${f.id}" type="${f.type||"text"}" value="${esc(f.value||"")}" autocomplete="off" ${f.id==="debitAmount"?'inputmode="decimal"':""} ${f.list?`list="ask-${f.id}"`:""}>${f.list?`<datalist id="ask-${f.id}">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`}</label>`).join("")}
      <div class="mrow"><span class="note err" data-e></span><button type="button" data-c>Huỷ bỏ</button><button class="primary${danger?" bad":""}" type="submit">${esc(ok||"OK")}</button></div></form></div>`;
    document.body.appendChild(d);
    const esck=e=>{if(e.key==="Escape"){e.stopPropagation();done(null)}};
    const done=v=>{d.remove();document.removeEventListener("keydown",esck,true);res(v)};
    document.addEventListener("keydown",esck,true);
    d.querySelector("[data-c]").onclick=()=>done(null);
    d.addEventListener("click",e=>{if(e.target===d)done(null)});
    d.querySelector("form").onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>v[f.id]=String(d.querySelector(`[name="${f.id}"]`).value).trim());
      const miss=fields.find(f=>f.required&&!v[f.id]);if(miss){d.querySelector("[data-e]").textContent="Chưa điền: "+miss.label;d.querySelector(`[name="${miss.id}"]`).focus();return}done(v)};
    setTimeout(()=>(d.querySelector("input,select")||d.querySelector("button.primary")).focus(),20);
  });
}

/* ---------- price memory ---------- */
function priceLines(filterKey){
  const out=[];
  S.jobs.forEach(j=>{if(filterKey&&groupKey(j)!==filterKey)return;
    const date=j.quoteSentAt||ymd(new Date(j.createdAt||Date.now()));
    (j.quote||[]).forEach(q=>{if(num(q.price)>0&&q.name)out.push({name:q.name,n:normName(q.name),price:num(q.price),currency:q.currency||"VND",unit:q.unit||"",date,code:j.code,id:j.id,key:groupKey(j),route:[j.pol,j.pod].filter(Boolean).join(" → "),mode:j.mode})})});
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
function lastPrice(name,key,exceptId){
  const n=normName(name);if(!n)return null;
  const all=priceLines().filter(x=>x.id!==exceptId&&x.n===n);
  return all.find(x=>x.key===key)||all[0]||null;
}
function hintHtml(q,j,i){
  const h=lastPrice(q.name,groupKey(j),j.id);
  if(!h)return `<span class="hint none">—</span>`;
  const same=h.key===groupKey(j);
  return `<button class="hint" data-act="useprice" data-i="${i}" title="${esc(h.key)} · ${esc(h.code)} · ${dmy(h.date)}">${fmt(h.price,h.currency)} ${h.currency}${same?"":" *"}</button>`;
}

/* ---------- render: side ---------- */
function visibleJobs(ignoreStatus){
  const q=S.q.toLowerCase();
  return S.jobs.filter(j=>{
    if(!ignoreStatus&&!S.fLate){if(S.fStatus==="open"&&!isOpen(j.status))return false;if(S.fStatus==="done"&&isOpen(j.status))return false}
    if(S.fLate){const st=lateState(j);if(!st||st==="ok")return false}
    if(S.group!=="__all"&&groupKey(j)!==S.group)return false;
    if(S.svc&&svcOf(j)!==S.svc)return false;
    if(S.who&&team()&&SPACE!=="mine"&&whoOf(j)!==S.who)return false;
    if(q){const h=[j.code,j.title,j.fwd,j.company,j.contact,j.refs,j.cargo,j.pol,j.pod,j.summary,j.mst,j.bl,j.cont,j.tkNo,j.truck,j.yard,j.blocker].join(" ").toLowerCase();if(!h.includes(q))return false}
    return true;
  }).sort((a,b)=>{
    const pa=a.priority==="Gấp"?0:1,pb=b.priority==="Gấp"?0:1;
    const da=a.deadline||"9999",dbb=b.deadline||"9999";
    return (isOpen(b.status)-isOpen(a.status))||(da<dbb?-1:da>dbb?1:0)||(pa-pb)||(b.createdAt||0)-(a.createdAt||0);
  });
}
function renderSide(){
  const m=new Map();
  S.jobs.forEach(j=>{const k=groupKey(j);const o=m.get(k)||{open:0,all:0,companies:new Set()};o.all++;if(isOpen(j.status))o.open++;if(j.company&&j.fwd)o.companies.add(j.company);m.set(k,o)});
  const keys=[...m.keys()].sort((a,b)=>a===NOGROUP?1:b===NOGROUP?-1:m.get(b).open-m.get(a).open||a.localeCompare(b,"vi"));
  if(S.group!=="__all"&&!m.has(S.group))S.group="__all";
  const sb=$("#sideBtn");if(sb){const nm=S.group==="__all"?"Tất cả FWD / công ty":S.group;sb.innerHTML=`<span class="sb-l">FWD</span><b>${esc(nm)}</b><span class="sb-c">▾</span>`}
  $("#side").innerHTML=`<div class="side-h">FWD / Công ty<button class="side-x" data-sidex aria-label="Đóng">✕</button></div>
    <button class="g ${S.group==="__all"?"on":""}" data-g="__all"><span>Tất cả</span><span class="n">${S.jobs.filter(j=>isOpen(j.status)).length}</span></button>`+
    keys.map(k=>`<button class="g ${S.group===k?"on":""}" data-g="${esc(k)}" title="${esc([...m.get(k).companies].join(", "))}"><span>${esc(k)}</span><span class="n">${m.get(k).open}</span></button>`).join("");
}

  const open=jobs.filter(j=>isOpen(j.status)).length;
  const last=jobs.reduce((a,j)=>Math.max(a,j.createdAt||0),0);
  const debt={},paid={},yr=String(new Date().getFullYear());

    ${Object.keys(fails).length?`<div class="chips"><span style="color:var(--muted)">Lô thất bại:</span>${Object.entries(fails).map(([r,n])=>`<span class="pill">${esc(r)}: ${n}</span>`).join("")}</div>`:""}
    ${contacts.length||companies.length?`<div class="chips">${contacts.length?`<span style="color:var(--muted)">Liên hệ:</span>${contacts.map(c=>`<span class="pill">${esc(c)}</span>`).join("")}`:""}${companies.length?`<span style="color:var(--muted)">Chủ hàng:</span>${companies.map(c=>`<span class="pill">${esc(c)}</span>`).join("")}`:""}</div>`:""}

      ${hist.length?`<div class="hwrap"><table class="h"><thead><tr><th>Ngày</th><th>Job</th><th>Hạng mục</th><th class="num">Đơn giá</th><th>Tuyến</th></tr></thead><tbody>
      ${hist.slice(0,40).map(h=>`<tr><td class="mono">${dmy(h.date)}</td><td class="mono"><a href="#" data-open="${h.id}">${esc(h.code)}</a></td><td>${esc(h.name)}</td><td class="num mono">${fmt(h.price,h.currency)} ${h.currency}${h.unit?"/"+esc(h.unit):""}</td><td>${esc([h.route,h.mode].filter(Boolean).join(" · "))}</td></tr>`).join("")}

function timeTag(j){

function quoteText(j){

  if(j.cargo)L.push(`Hàng: ${j.cargo}`);L.push("");
  const ln=(q,i)=>`${i+1}. ${q.name}: ${fmt(q.qty)} ${q.unit||""} × ${fmt(q.price,q.currency)} = ${fmt(num(q.qty)*num(q.price),q.currency)} ${q.currency||"VND"}`;
  const QA=(j.quote||[]).filter(q=>!q.ch),QB=(j.quote||[]).filter(q=>q.ch);
  if(QB.length&&QA.length)L.push("PHÍ DỊCH VỤ");
  QA.forEach((q,i)=>L.push(ln(q,i)));
  const t=totals(j),ct=chTotals(j),vat=vatRate(j);L.push("");
  Object.keys(t).forEach(c=>{L.push(`Cộng${QB.length?" phí dịch vụ":""}: ${fmt(t[c],c)} ${c}`);if(vat){L.push(`VAT ${vat}%: ${fmt(vatOf(t[c],vat,c),c)} ${c}`);L.push(`Tổng${QB.length?" phí dịch vụ":" cộng"}: ${fmt(grandOf(t[c],vat,c),c)} ${c}`)}});

/* Ô ngày gõ tay dạng dd/mm (2 số), năm tự lấy năm nay; có nút lịch để chọn */
function dmParse(t){t=String(t||"").trim();if(!t)return "";
  const m=t.match(/^(\d{1,2})\D?(\d{1,2})(?:\D?(\d{2}|\d{4}))?$/)||(/^\d{4}$/.test(t)?[t,t.slice(0,2),t.slice(2)]:null);if(!m)return null;
  const dd=+m[1],mm=+m[2],now=new Date();let y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):now.getFullYear();
  if(mm<1||mm>12||dd<1||dd>new Date(y,mm,0).getDate())return null;
  if(!m[3]&&new Date(y,mm-1,dd)<new Date(now.getFullYear(),now.getMonth()-2,now.getDate()))y++; // đã qua lâu thì hiểu là năm sau
  return `${y}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`}
const dmShow=v=>v?v.slice(8,10)+"/"+v.slice(5,7):"";
function dmWire(root){root.querySelectorAll(".dmbox").forEach(b=>{const t=b.querySelector("input:not(.dmpick)"),p=b.querySelector(".dmpick");
  t.addEventListener("input",e=>{if(e.inputType&&e.inputType.startsWith("delete"))return;let v=t.value.replace(/[^\d/]/g,"");if(/^\d{2}$/.test(v))v+="/";if(/^\d{3}$/.test(v))v=v.slice(0,2)+"/"+v[2];t.value=v});
  t.addEventListener("blur",()=>{const r=dmParse(t.value);if(r)t.value=dmShow(r)+(r.slice(0,4)!==String(new Date().getFullYear())?"/"+r.slice(2,4):"")});
  b.querySelector(".dmcal").onclick=()=>{const r=dmParse(t.value);p.value=r||TODAY();try{p.showPicker()}catch(e){p.focus();p.click()}};
  p.onchange=()=>{if(p.value){t.value=dmShow(p.value)+(p.value.slice(0,4)!==String(new Date().getFullYear())?"/"+p.value.slice(2,4):"");t.focus()}}})}

/* ---------- Lô hàng: dán chữ / ảnh → tự điền các ô ---------- */
const LOTF={mst:"MST khách",bl:"Số B/L / booking",cont:"Số cont / xe",tkNo:"Số tờ khai",hqCode:"Mã Hải quan",lane:"Luồng",vehicle:"Loại xe",truck:"Nhà xe / biển số",yard:"Bãi hạ cont",cbm:"Số khối (m³)",
  pol:"Nơi đi (POL)",pod:"Nơi đến (POD)",incoterm:"Incoterm",refs:"Số booking / invoice",cargo:"Hàng hoá / số lượng"};
function lotRegex(t){
  t=String(t||"").normalize("NFC");
  // bản không dấu, cùng độ dài, để dò nhãn tiếng Việt viết có / không dấu
  const A=t.split("").map(c=>{const d=c.normalize("NFD").replace(/[̀-ͯ]/g,"");return d.length===1?d:c}).join("").replace(/đ/g,"d").replace(/Đ/g,"D");
  const L=t.split("\n"),LA=A.split("\n"),U=A.toUpperCase();
  const m=(re,i=1,src=A)=>{const x=re.exec(src);return x?String(x[i]||"").trim():""};
  // lấy phần chữ sau nhãn trên cùng dòng (giữ dấu tiếng Việt)
  const after=re=>{for(let i=0;i<LA.length;i++){const x=re.exec(LA[i]);if(x){const v=L[i].slice(x.index+x[0].length).replace(/^[\s:.\-–=>]+/,"").split(/\s*[;|]\s*|\s{3,}|\t/)[0].trim();if(v)return v.slice(0,60)}}return ""};
  const hasDigit=v=>/\d/.test(v)?v:"";
  const o={};
  o.mst=m(/(?:\bmst\b|ma\s*so\s*thue|ma\s*so\s*dn|tax\s*(?:code|id|no)|vat\s*(?:code|no))\D{0,6}(\d{10}(?:\s*-?\s*\d{3})?)/i).replace(/\s/g,"");
  o.bl=hasDigit(m(/(?:\bh?b\/?l\b|\bmbl\b|\bhbl\b|bill(?:\s+of\s+lading)?|\bbl\s*no|van\s*don)\s*(?:no\.?|number|so|#)?\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\-\/]{5,24})/i));
  const conts=[...new Set([...U.matchAll(/\b([A-Z]{3}[UJZ])\s?-?(\d{6})\s?-?(\d)\b/g)].map(x=>x[1]+x[2]+x[3]))];
  let size="";const r1=/\b(\d{1,2})\s*(?:x|×|\*|cont(?:ainer)?s?|cnt?r?s?)\s*(20|40|45)\s*('|’|"|ft|feet|dc|gp|hc|hq|rf|ot|rh)?/i.exec(A),r2=/\b(20|40|45)\s*('|’|ft|dc|gp|hc|hq|rf|ot)?\s*(?:x|×|\*)\s*(\d{1,2})\b/i.exec(A);
  const ty=v=>{v=(v||"").toUpperCase();return /^['’"]|FT|FEET/.test(v)?"'":v};
  if(r1)size=`${+r1[1]}x${r1[2]}${ty(r1[3])}`;else if(r2)size=`${+r2[3]}x${r2[1]}${ty(r2[2])}`;
  o.cont=[size,conts.join(", ")].filter(Boolean).join(" · ");
  o.tkNo=m(/(?:to\s*khai|\bso\s*tk\b|\btk\b|declaration|\bcd\s*no)\D{0,8}(\d{12})/i)||m(/\b([13]\d{11})\b/);
  const ln=m(/(?:phan\s*)?luong\s*[:\-]?\s*(xanh|vang|do)\b/i).toLowerCase()||({green:"xanh",yellow:"vang",red:"do"})[m(/\b(green|yellow|red)\s*(?:channel|lane)/i).toLowerCase()]||"";
  o.lane=ln==="xanh"?"Xanh":ln==="vang"?"Vàng":ln==="do"?"Đỏ":"";
  const pl=/\b(\d{2}[A-Z]{1,2}\d?)\s?[-.]?\s?(\d{3})\.?(\d{2})\b/.exec(t.toUpperCase());
  const nhaxe=after(/(?:nha\s*xe|nha\s*van\s*chuyen|trucking|nhà xe)\s*/i);
  o.truck=[nhaxe.split(/\s*[,;]\s*/)[0],pl?`${pl[1]}-${pl[2]}.${pl[3]}`:""].filter(Boolean).join(" · ");
  if(!conts.length&&/\bxe\s*tai\b|\b\d+(?:[.,]\d+)?\s*tan\b|tai\s*trong/i.test(A))o.vehicle="Xe tải";else if(conts.length||size)o.vehicle="Xe cont";
  o.cbm=m(/(\d+(?:[.,]\d+)?)\s*(?:cbm|m3|m³|khoi)\b/i);
  o.hqCode=m(/(?:ma\s*(?:hq|hai\s*quan|chi\s*cuc)|chi\s*cuc(?:\s*hq)?)\s*[:\-]?\s*(\d{2}[A-Z0-9]{2})\b/i).toUpperCase();
  o.pol=after(/(?:\bpol\b|port\s+of\s+loading|loading\s+port|cang\s*(?:di|xep(?:\s*hang)?)|noi\s*di|\bfrom\s*:|ship\s*from)/i);
  o.pod=after(/(?:\bpod\b|port\s+of\s+discharge|discharge\s+port|cang\s*(?:den|do(?:\s*hang)?|dich)|noi\s*den|\bto\s*:|destination)/i);
  o.incoterm=m(/\b(EXW|FCA|FAS|FOB|CFR|CNF|CIF|CPT|CIP|DAP|DPU|DDP)\b/,1,U);if(o.incoterm==="CNF")o.incoterm="CFR";
  o.refs=hasDigit(m(/(?:invoice|\binv\b|booking|\bbkg\b|hoa\s*don)\s*(?:no\.?|number|so|#)?\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\/\-]{3,24})/i));
  o.cargo=after(/(?:hang\s*hoa|ten\s*hang|mat\s*hang|commodity|description(?:\s+of\s+goods)?|\bgoods)\s*(?=[:\-])/i);
  o.yard=after(/(?:ha\s*(?:cont\s*)?rong|tra\s*(?:cont\s*)?rong|bai\s*ha|depot|empty\s*return)\s*(?:tai|o|ve)?/i).replace(/[,.].*$/,"");
  Object.keys(o).forEach(x=>{if(!o[x])delete o[x]});
  return o;
}

function setLotField(j,f,v){

  if(f==="service"){
    const was=j.svcPending;delete j.svcPending;j.service=v;
    if(v==="VC"){dropFee(j,FEE_HQ);CHECKS.forEach(c=>dropFee(j,c[3]));j.checks=[]}else addFee(j,FEE_HQ,"tờ khai",true);
    if(v==="HQ")dropFee(j,FEE_VC);else addFee(j,FEE_VC,isTruck(j)?"chuyến":"cont");
    if(v!=="HQ"&&!j.vehicle)j.vehicle="Xe cont";
    if(v==="VC"&&["Khác","Khai HQ nhập","Khai HQ xuất"].includes(j.type))j.type="Vận chuyển";
    if(v!=="VC"&&["Khác","Vận chuyển"].includes(j.type))j.type="Khai HQ nhập";
    if(was&&!(j.tasks||[]).length)j.tasks=tplTasks(j.type);
    logH(j,{kind:"note",note:"Chọn dịch vụ "+v});
  }else if(f==="chk"){const c=CHECKS.find(x=>x[0]===v);if(!c)return;const fee=c[3],has=(j.checks||[]).includes(v);
    j.checks=has?j.checks.filter(x=>x!==v):(j.checks||[]).concat(v);
    has?dropFee(j,fee):addFee(j,fee);
    logH(j,{kind:"note",note:(has?"Bỏ ":"Chọn ")+fee.slice(4)});
    if(!has)autoRule(j,"chk:"+v);

function seenPush(key,at){
  if(!team()||!db||document.hidden||!at||(seenSent[key]||0)>=at)return;
  if(key!=="team"){const j=S.all.find(x=>x.id===key);if(!j||(boss()&&isMine(j)))return} // Việc riêng: không ghi
  seenSent[key]=at;
  db.collection(seenCol(key)).doc(me()).set({at,name:window.SOJOB_USER||"",ts:Date.now()}).catch(()=>{seenSent[key]=0});
}
function seenWatch(key){
  if(!team()||!db)return;
  if(key==="team"){if(teamSeenSub)return;try{teamSeenSub=db.collection("teamseen").onSnapshot(s=>{S.seen.team=s.docs.map(d=>Object.assign({mail:d.id},d.data()));teamPaint()},()=>{})}catch(e){}return}
  const j=S.all.find(x=>x.id===key);if(j&&boss()&&isMine(j))return;
  if(seenSub.id===key)return;if(seenSub.off)try{seenSub.off()}catch(e){}
  seenSub={id:key,off:null};
  try{seenSub.off=db.collection(seenCol(key)).onSnapshot(s=>{S.seen[key]=s.docs.map(d=>Object.assign({mail:d.id},d.data()));chatPaint(key)},()=>{})}catch(e){}
}
const avIni=n=>{const w=String(n||"?").trim().split(/\s+/);return (w[w.length-1]||"?").charAt(0).toUpperCase()};
const avHue=x=>{let h=0;for(const c of String(x))h=(h*31+c.charCodeAt(0))%360;return h};
const seenTime=t=>{if(!t)return "";const d=new Date(t);return d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})+(d.toDateString()===new Date().toDateString()?"":" "+d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"}))};
/* msgId → danh sách người có tin mới nhất đã đọc là tin đó (bỏ qua mình, và người mà tin đó do chính họ gửi) */
function seenMap(key,ms){
  const out={};if(!ms||!ms.length)return out;
  (S.seen[key]||[]).forEach(r=>{const mail=String(r.mail||"").toLowerCase();if(!mail||mail===me())return;
    let m=null;for(let i=ms.length-1;i>=0;i--)if((ms[i].at||0)<=(r.at||0)){m=ms[i];break}
    if(!m||String(m.by||"").toLowerCase()===mail)return;
    (out[m.id]=out[m.id]||[]).push({mail,name:(S.people&&S.people[mail]&&S.people[mail].n)||r.name||whoName(mail),ts:r.ts||r.at});});
  return out;
}
function seenRow(sm,m,last){
  const L=(sm[m.id]||[]).sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!L.length)return last&&m.by===me()&&!String(m.id||"").startsWith("tmp")?`<div class="seen"><span class="seen-l">✓ Đã gửi</span></div>`:"";
  const tip=L.map(p=>p.name+" · xem lúc "+seenTime(p.ts)).join("\n");
  const av=L.slice(0,6).map(p=>`<i class="av" style="--h:${avHue(p.mail)}">${esc(avIni(p.name))}</i>`).join("")+(L.length>6?`<i class="av more">+${L.length-6}</i>`:"");
  const lab=last?`<span class="seen-l">✓✓ Đã xem: ${esc(L.slice(0,3).map(p=>p.name).join(", "))}${L.length>3?` và ${L.length-3} người`:""}</span>`:"";
  return `<div class="seen${last?" last":""}" data-seen="${esc(tip)}" title="${esc(tip)}" role="button" tabindex="0">${av}${lab}</div>`;
}

async function mailAtt(btn){

function normalize(r){
  r=(r&&typeof r==="object"&&!Array.isArray(r))?r:{};
  const s=v=>typeof v==="string"?v.trim():(v==null?"":String(v));
  const pick=(v,arr,d)=>arr.includes(s(v))?s(v):d;
  const dl=/^\d{4}-\d{2}-\d{2}$/.test(s(r.deadline))?s(r.deadline):"";
  const list=v=>Array.isArray(v)?v:(v?[v]:[]);
  const type=pick(r.type,TYPES,"Khác");
  const tasks=tplTasks(type),have=new Set(tasks.map(t=>normName(t.text)));
  list(r.tasks).map(t=>s(typeof t==="object"&&t?t.text:t)).filter(t=>t&&!have.has(normName(t))).slice(0,8).forEach(t=>{if(!have.has(normName(t))){have.add(normName(t));tasks.push({text:t,done:false})}});
  const quote=list(r.quote).filter(q=>q&&typeof q==="object").map(q=>({name:s(q.name),qty:num(q.qty)||1,unit:s(q.unit),price:num(q.price),currency:CURS.includes(s(q.currency))?s(q.currency):"VND"})).filter(q=>q.name).slice(0,25);
  const fwd=s(r.fwd),company=s(r.company),key=fwd||company||NOGROUP;
  quote.forEach(q=>{if(!q.price){const h=lastPrice(q.name,key,null);if(h){q.price=h.price;q.currency=h.currency;if(!q.unit)q.unit=h.unit}}});
  return{fwd,company,contact:s(r.contact),source:pick(r.source,SOURCES,"Khác"),title:s(r.title).slice(0,120),
    type,mode:pick(r.mode,MODES,""),pol:s(r.pol),pod:s(r.pod),cargo:s(r.cargo),incoterm:s(r.incoterm),refs:s(r.refs),
    deadline:dl,priority:pick(r.priority,PRIOS,"Thường"),summary:s(r.summary),tasks,quote,
    status:type==="Báo giá"?"Báo giá":STAGES[0],
    service:SERVICES.includes(s(r.service).toUpperCase().replace(/\s/g,""))?s(r.service).toUpperCase().replace(/\s/g,""):(type==="Vận chuyển"?"VC":"HQ"),
    mst:s(r.mst).replace(/[^\d-]/g,"").slice(0,14),vehicle:VEHICLES.includes(s(r.vehicle))?s(r.vehicle):"",yard:s(r.yard),cbm:s(r.cbm).replace(/[^\d.,]/g,""),bl:s(r.bl),cont:s(r.cont),tkNo:s(r.tkNo).replace(/[^\d]/g,"").slice(0,12),
    questions:list(r.questions).map(s).filter(Boolean).join("\n")};
}

/* ---------- đọc chữ miễn phí (không cần Claude): chép chữ trong ảnh + đoán vài trường ---------- */
function guessFromText(t){
  const text=String(t||""),up=text.toUpperCase(),low=normName(text);
  const m=(re,i=1)=>{const r=text.match(re);return r?String(r[i]).trim():""};
  const conts=[...new Set((up.match(/\b[A-Z]{3}U\s?\d{7}\b/g)||[]).map(x=>x.replace(/\s/g,"")))];
  const qty=m(/\b(\d{1,2}\s*[xX×]\s*(?:20|40|45)\s*(?:'|DC|GP|HC|HQ|RF|OT|FR)?)/);
  const cont=[qty.replace(/\s/g,"").replace("×","x"),conts.slice(0,6).join(", ")].filter(Boolean).join(" · ");
  const bl=m(/(?:\bM?H?B\/?L\b|\bBILL\b|\bBOOKING\b|\bBKG\b|vận đơn)\s*(?:NO\.?|NUMBER|số)?\s*[:#.]?\s*([A-Z0-9][A-Z0-9-]{5,})/i);
  const mst=m(/(?:\bMST\b|mã số thuế|tax\s*code)[^\d\n]{0,25}(\d{10}(?:-\d{3})?)/i);
  const tkNo=m(/(?:tờ khai|\bTK\b|số TK)[^\d\n]{0,20}(\d{12})/i)||m(/\b((?:10|30)\d{10})\b/);
  const known=[...new Set(S.jobs.flatMap(j=>[j.fwd,j.company]).filter(Boolean))].sort((a,b)=>b.length-a.length);
  const hit=known.find(n=>normName(n).length>=3&&low.includes(normName(n)));
  const isFwd=hit&&S.jobs.some(j=>j.fwd===hit);
  const vc=/van chuyen|trucking|keo cont|xe cont|xe tai|giao hang|dong hang|ha cont|nang ha|\btruck\b/.test(low);
  const hq=/khai|thong quan|hai quan|to khai|\bc\/o\b|kiem hoa|customs/.test(low);
  const service=vc&&hq?"HQ+VC":vc?"VC":"HQ";
  const cbm=m(/(\d+(?:[.,]\d+)?)\s*(?:cbm|m3|m³|khối)(?![a-z0-9])/i).replace(",",".");
  const yard=m(/(?:hạ cont|hạ rỗng|trả rỗng|depot|bãi hạ)\s*(?:tại|ở|về)?\s*[:：]?\s*([^\n,.;]{3,40})/i);
  const vehicle=service==="HQ"?"":(/xe tai|\btan\b|\btruck\b|hang le|\blcl\b/.test(low)&&!/xe cont|keo cont|\b(20|40|45)\s*(dc|gp|hc|hq|'|ft)/.test(low)?"Xe tải":"Xe cont");
  const type=/bao gia|hoi gia|xin gia|quotation|\brate\b/.test(low)?"Báo giá":service==="VC"?"Vận chuyển":/xuat khau|khai xuat|\bexport\b/.test(low)?"Khai HQ xuất":"Khai HQ nhập";
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>=6&&!/^(from|to|cc|sent|date|gửi|đến|ngày|re:|fw:)\b/i.test(s));
  const subj=m(/(?:subject|tiêu đề|chủ đề)\s*[:：]\s*(.+)/i);
  const title=(subj||lines[0]||"Job đọc từ ảnh").replace(/^(re|fw|fwd)\s*:\s*/i,"").slice(0,90);
  return{title,fwd:hit&&isFwd?hit:"",company:hit&&!isFwd?hit:"",service,vehicle,yard,cbm,type,bl,cont,mst,tkNo,
    summary:text.replace(/\s+/g," ").slice(0,400),source:"Khác",tasks:tplTasks(type),status:type==="Báo giá"?"Báo giá":STAGES[0]};
}

function tkInputs(j){const g=f=>{const el=document.getElementById("f-"+f);return String((el&&el.value)||j[f]||"").trim()};

    if(k<0)k=d.lines.findIndex((x,i)=>!used.has(i)&&!x.src&&(x.name===dbName(j,q)||x.name===q.name));
    let l;
    if(k>=0){used.add(k);l=d.lines[k];l.src=q.name;
      if(!l.numEdited){l.price=num(q.price);l.qty=num(q.qty)||1;l.unit=q.unit||l.unit}
      if(!l.nameEdited)l.name=dbName(j,q);if(q.ch)l.sec="B"}
    else l={src:q.name,sec:q.ch?"B":"A",name:dbName(j,q),unit:q.unit||"lô",price:num(q.price),qty:num(q.qty)||1,vat:"8",inv:""};
    out.push(l)});
  d.lines.forEach((x,i)=>{if(!used.has(i)&&!x.src)out.push(x)});
  if(out.length&&!out.some(l=>l.inv==="FDI")){const a=out.find(l=>l.sec!=="B");if(a&&!a.inv)a.inv="FDI"}
  d.lines=out;
  const inf={tk:j.tkNo||"",bl:j.bl||"",veh:j.vehicle||"",qty:dbQty(j),cargo:j.cargo||"",conts:dbConts(j)};
  d.info=d.info||{};Object.keys(inf).forEach(k=>{if(!String(d.info[k]||"").trim()&&inf[k])d.info[k]=inf[k]});
  return d}
const dbRate=v=>v==="KCT"?0:num(v)/100;
function dbCalc(d){const r={A:[],B:[],sumA:0,vatA:0,sumB:0};
  d.lines.forEach((l,i)=>{const amt=Math.round(num(l.price)*num(l.qty));
    if(l.sec==="B"){r.B.push({...l,i,amt});r.sumB+=amt}else{const v=Math.round(amt*dbRate(l.vat));r.A.push({...l,i,amt,v});r.sumA+=amt;r.vatA+=v}});
  r.totA=r.sumA+r.vatA;r.total=r.totA+r.sumB;return r}

function fixJob(j){
  if(LEGACY[j.status]){if(j.status==="Chờ phản hồi")j.waiting=true;j.status=LEGACY[j.status]}
  if(!SERVICES.includes(j.service)&&!j.svcPending)j.service=j.type==="Vận chuyển"?"VC":"HQ";
  const vc=j.service==="VC";
  if(OLDST[j.status])j.status=OLDST[j.status];
  else if(j.status==="Chốt"||j.status==="Làm hàng")j.status=vc?"Chờ điều xe":"Đang khai báo";
  else if(j.status==="Thông quan")j.status=vc?"Đang vận chuyển":"Chờ thông quan";
  else if(j.status==="Debit")j.status=j.debitDate?"Chờ thu tiền":"Bảng kê / debit";
  if(!STAGES.includes(j.status))j.status=STAGES[0];
  if(j.waiting){if(!j.blocker)j.blocker="Chờ khách phản hồi";j.waiting=false}
  if(!j.stageAt)j.stageAt=j.updatedAt||j.createdAt||Date.now();
  if(!Array.isArray(j.history))j.history=[];
  if(num(j.debitAmount))j.debitAmount=roundMoney(num(j.debitAmount),j.debitCurrency);
  return j}
renderAll(true);
(async()=>{
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,sample,assets]=await Promise.all([use("db"),use("sample"),use("assets")]);
  if(!db){S.loaded=true;$("#banner").innerHTML=`<div class="banner">Không kết nối được kho lưu job. Bạn vẫn tạo job được, nhưng sẽ mất khi tải lại trang.</div>`;renderAll(true);return}
  const timer=setTimeout(()=>{if(!S.loaded){S.loaded=true;$("#banner").innerHTML=`<div class="banner">Chưa tải được dữ liệu, đang thử lại…</div>`;renderAll()}},10000);
  const fail=err=>{clearTimeout(timer);S.loaded=true;$("#banner").innerHTML=`<div class="banner">Mất kết nối kho dữ liệu (${esc(err?.code)}). Tải lại trang để thử lại.</div>`;renderAll()};
  const onJobs=(docs,fromCache)=>{
    const local=new Map(S.all.map(j=>[j.id,j]));
    S.all=docs.map(d=>dirty.has("jobs/"+d.id)&&local.has(d.id)?local.get(d.id):fixJob(Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data())))));
    local.forEach((j,id)=>{if(dirty.has("jobs/"+id)&&!S.all.some(x=>x.id===id))S.all.push(j)});
    applySpace();if(!fromCache){S.jobsServer=true;splitPartners()}
    if(!fromCache){clearTimeout(timer);$("#banner").innerHTML=""}
    S.loaded=true;if(S.sel&&!cur())S.sel=null;renderAll(false);
  };
  if(boss())db.collection("jobs").onSnapshot(snap=>onJobs(snap.docs,snap.metadata.fromCache),fail);
  else{const part={};const go=()=>{if(!part.a||!part.b)return;const m=new Map();[...part.a.docs,...part.b.docs].forEach(d=>m.set(d.id,d));onJobs([...m.values()],part.a.metadata.fromCache||part.b.metadata.fromCache)};
    db.collection("jobs").where("shared","==",true).onSnapshot(s=>{part.a=s;go()},fail);
    db.collection("jobs").where("createdBy","==",me()).onSnapshot(s=>{part.b=s;go()},fail)}
  db.doc("meta/templates").onSnapshot(d=>{
    if(dirty.has("meta/templates"))return;
    const by=d.exists?d.data().byType:null;
    S.tpl=Object.assign(JSON.parse(JSON.stringify(DEFAULT_TPL)),by?JSON.parse(JSON.stringify(by)):{});
    S.stall=Object.assign({...DEFAULT_STALL},d.exists&&d.data().stall?JSON.parse(JSON.stringify(d.data().stall)):{});
    if(!(d.exists&&d.data().stallV2)){STRICT.forEach(k=>S.stall[k]=DEFAULT_STALL[k]);if(boss()&&d.exists)saveTpl()}
    if(S.view==="board"||S.view==="plan")renderMain();
    if(S.view==="tpl")renderMain();renderDetail();
  },()=>{});
  (boss()?db.collection("todos"):db.collection("todos").where("createdBy","==",me())).onSnapshot(snap=>{
    const local=new Map(S.todos.map(t=>[t.id,t]));
    S.todos=snap.docs.filter(d=>!team()||!d.data().createdBy||d.data().createdBy===me()).map(d=>dirty.has("todos/"+d.id)&&local.has(d.id)?local.get(d.id):Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()))));
    local.forEach((t,id)=>{if(dirty.has("todos/"+id)&&!S.todos.some(x=>x.id===id))S.todos.push(t)});
    if(S.view==="plan"&&S.loaded)renderPlan($("#content"));
  },()=>{});
  db.collection("partners").onSnapshot(snap=>{
    snap.docs.forEach(d=>{if(!dirty.has("partners/"+d.id))S.partners[d.id]=JSON.parse(JSON.stringify(d.data()))});
    if(!snap.metadata||!snap.metadata.fromCache){S.partnersLoaded=true;splitPartners()}
    renderProfile();
  },()=>{});
  if(spaceOn())db.collection("mypartners").onSnapshot(snap=>{
    snap.docs.forEach(d=>{if(!dirty.has("mypartners/"+d.id))S.pMine[d.id]=JSON.parse(JSON.stringify(d.data()))});
    renderProfile();
  },()=>{});
})();
</script>
</body></html>
